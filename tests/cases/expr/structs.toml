[[case]]
name = "analyzer_empty_struct_expr_valid"
kind = "analyzer"
source = """
struct Empty {}
fn main() {
    let v = Empty {};
}
"""
expected_mir = """
main -> unit:
  .bb1:
    v#1: Empty = alloc
    return
"""

[[case]]
name = "analyzer_single_field_struct_expr_valid"
kind = "analyzer"
source = """
struct Point {
    x: u8,
}
fn main() {
    let v = Point { x: 1 };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    #1: Point = alloc
    #2: u8 = copy 1
    v#3: Point = write #1.x = #2
    return
"""

[[case]]
name = "analyzer_multi_field_struct_expr_valid"
kind = "analyzer"
source = """
struct Point {
    x: u8,
    y: u8,
}
fn main() {
    let v = Point { x: 1, y: 2 };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    #1: Point = alloc
    #2: u8 = copy 1
    #3: Point = write #1.x = #2
    #4: u8 = copy 2
    v#5: Point = write #3.y = #4
    return
"""

[[case]]
name = "analyzer_fields_in_different_order_than_declaration_valid"
kind = "analyzer"
source = """
struct Point {
    x: u8,
    y: u8,
}
fn main() {
    let v = Point { y: 2, x: 1 };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    #1: Point = alloc
    #2: u8 = copy 2
    #3: Point = write #1.y = #2
    #4: u8 = copy 1
    v#5: Point = write #3.x = #4
    return
"""

[[case]]
name = "analyzer_nested_struct_expr_valid"
kind = "analyzer"
source = """
struct Inner {
    value: u8,
}
struct Wrapper {
    inner: Inner,
}
fn main() {
    let v = Wrapper { inner: Inner { value: 1 } };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    #1: Wrapper = alloc
    #2: Inner = alloc
    #3: u8 = copy 1
    #4: Inner = write #2.value = #3
    v#5: Wrapper = write #1.inner = #4
    return
"""

[[case]]
name = "analyzer_struct_expr_field_value_is_complex_expression_valid"
kind = "analyzer"
source = """
struct Point {
    x: u8,
}
fn main() {
    let a: u8 = 1;
    let v = Point { x: a + 1 };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    a#1: u8 = copy 1
    #2: Point = alloc
    #3: u8 = copy 1
    #4: u8 = add a#1, #3
    v#5: Point = write #2.x = #4
    return
"""

