params = { C = [1, 2, 255, 256, 32767, 32768, 65534, 65535] }
expect_rewrite = ["canonicalize"]
source = """
global N: u16;

fn f() -> u16 {
    let n = N;
    let a = n - $C$;
    return a;
}

fn main() {
    N = 1;
    f();
}
"""

