[[case]]
name = "attribute_on_const"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
const A: u8 = 1;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: Spanned(
        data: "this_attribute",
        span: SourceSpan(
          offset: SourceOffset(2),
          length: 14,
        ),
      ),
    ),
  ],
  data: ConstDecl(ConstDecl(
    name: Spanned(
      data: "A",
      span: SourceSpan(
        offset: SourceOffset(24),
        length: 1,
      ),
    ),
    ty: TyRef(
      name: Spanned(
        data: "u8",
        span: SourceSpan(
          offset: SourceOffset(27),
          length: 2,
        ),
      ),
    ),
    value: Expr(
      span: SourceSpan(
        offset: SourceOffset(32),
        length: 1,
      ),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

