[[case]]
name = "global_region_oam"
kind = "codegen"
source = """
#[region = oam]
global SPRITES: [Sprite; 40];

struct Sprite {
    y: u8,
    x: u8,
    tile_index: u8,
    flags: u8,
}

fn main() {
    SPRITES[0].y = 3;
}
"""
expected_lir = """
START_SECTION OAM
SPRITES::
alloc 1280 x bit
END_SECTION

START_SECTION ROM0
main::
.bb1:
  LD r8#1, $00
  LD r8#2, $00
  LD r8#3, r8#2
  LD r8#4, r8#1
  LD r8#5, r8#4
  LD r8#6, r8#3
  LD r8#7, $03
  LD r8#8, r8#7
  (out=r16#1;high_in=r8#6;low_in=r8#5)
  LD HL, SPRITES+$0000
  ADD HL, r16#1; c
  ADD HL, r16#1; c
  ADD HL, r16#1; c
  ADD HL, r16#1; c
  LD [HL], r8#8
  RET

END_SECTION

START_SECTION ROM0[$100]
@CART_HEADER_CODE::
.bb1:
  NOP
  JP @BOOTSTRAP

END_SECTION

