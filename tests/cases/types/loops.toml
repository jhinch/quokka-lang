[[case]]
name = "infinite_loop_as_fn_body_satisfies_non_unit_return_ty"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn foo() -> u8 {
    loop {
    }
}
"""
expected_mir = """
foo -> u8:
  .bb1:
    jump .bb2
  .bb2:
    jump .bb2
"""

[[case]]
name = "code_after_infinite_loop_statement_is_unreachable"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    loop {
    }
    let x: u8 = 1;
}
"""
expected_errors = [
    "unreachable code @ [33:47]",
]

[[case]]
name = "loop_with_break_value_used_by_let"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let x: u8 = 1;
    let r: u8 = loop {
        break x;
    };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    jump .bb2
  .bb2:
    x#2: <unresolved> = copy x#1
    #3: u8 = copy x#2
    #4: u8 = copy #3
    jump .bb3
  .bb3:
    r#5: <unresolved> = copy #4
    return
"""

[[case]]
name = "loop_break_type_mismatch_across_multiple_breaks"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let x: u8 = 1;
    let c: u1 = 1;
    loop {
        break x;
        break c;
    }
}
"""
expected_errors = [
    "unreachable code @ [86:94]",
    "`u8` is not equal to `u1` @ [92:93]",
]

[[case]]
name = "nested_loop_break_targets_innermost_loop"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let x: u1 = 1;
    loop {
        loop {
            break x;
        }
        break x;
    }
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    jump .bb2
  .bb2:
    x#5: <unresolved> = copy x#1
    jump .bb4
  .bb4:
    x#2: <unresolved> = copy x#5
    #3: u1 = copy x#2
    #4: u1 = copy #3
    jump .bb5
  .bb5:
    #6: u1 = copy x#5
    #7: u1 = copy #6
    jump .bb3
  .bb3:
    return
"""

[[case]]
name = "loop_without_break_used_as_value_is_never"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let r: u8 = loop {
    };
}
"""
expected_errors = [
    "`u8` is not equal to `never` @ [28:40]",
]
