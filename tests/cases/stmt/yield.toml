[[case]]
name = "literal_value"
kind = "parser"
entrypoint = "statement"
source = """
yield 1;
"""
expected_ast = """
Statement(
  span: (0, 8),
  data: Yield(YieldSmt(
    value: Expr(
      span: (6, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "block_value_still_requires_semicolon"
kind = "parser"
entrypoint = "statement"
source = """
yield {
    yield 1;
};
"""
expected_ast = """
Statement(
  span: (0, 23),
  data: Yield(YieldSmt(
    value: Expr(
      span: (6, 16),
      data: Block(Block(
        span: (6, 16),
        statements: [
          Statement(
            span: (12, 8),
            data: Yield(YieldSmt(
              value: Expr(
                span: (18, 1),
                data: Integer(IntegerLiteral(
                  value: 1,
                )),
              ),
            )),
          ),
        ],
      )),
    ),
  )),
)
"""

[[case]]
name = "if_with_block_value_still_requires_semicolon"
kind = "parser"
entrypoint = "statement"
source = """
yield if 1 then {
    yield 2;
} else {
    yield 3;
};
"""
expected_ast = """
Statement(
  span: (0, 55),
  data: Yield(YieldSmt(
    value: Expr(
      span: (6, 48),
      data: If(If(
        condition: Expr(
          span: (9, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        true_block: Expr(
          span: (16, 16),
          data: Block(Block(
            span: (16, 16),
            statements: [
              Statement(
                span: (22, 8),
                data: Yield(YieldSmt(
                  value: Expr(
                    span: (28, 1),
                    data: Integer(IntegerLiteral(
                      value: 2,
                    )),
                  ),
                )),
              ),
            ],
          )),
        ),
        false_block: Some(Expr(
          span: (38, 16),
          data: Block(Block(
            span: (38, 16),
            statements: [
              Statement(
                span: (44, 8),
                data: Yield(YieldSmt(
                  value: Expr(
                    span: (50, 1),
                    data: Integer(IntegerLiteral(
                      value: 3,
                    )),
                  ),
                )),
              ),
            ],
          )),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "loop_value_still_requires_semicolon"
kind = "parser"
entrypoint = "statement"
source = """
yield loop {
    break 1;
};
"""
expected_ast = """
Statement(
  span: (0, 28),
  data: Yield(YieldSmt(
    value: Expr(
      span: (6, 21),
      data: Loop(Loop(
        body: Block(
          span: (11, 16),
          statements: [
            Statement(
              span: (17, 8),
              data: Break(BreakSmt(
                value: Some(Expr(
                  span: (23, 1),
                  data: Integer(IntegerLiteral(
                    value: 1,
                  )),
                )),
              )),
            ),
          ],
        ),
      )),
    ),
  )),
)
"""

[[case]]
name = "missing_value"
kind = "parser"
entrypoint = "statement"
source = """
yield;
"""
expected_errors = [
    "Syntax error: found ; when expecting <number>, <ident>, (, [, !, -, if or loop @ [5:6]",
]

[[case]]
name = "missing_semicolon_after_value"
kind = "parser"
entrypoint = "statement"
source = """
yield 1
"""
expected_errors = [
    "Syntax error: found <EOF> when expecting ; @ [8:8]",
]

[[case]]
name = "missing_semicolon_after_block_value"
kind = "parser"
entrypoint = "statement"
source = """
yield {}
"""
expected_errors = [
    "Syntax error: found <EOF> when expecting ; @ [9:9]",
]
