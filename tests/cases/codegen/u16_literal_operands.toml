  XOR A, $80; z, c
  LD C, A
  LD A, B
  SUB A, $fe; z, c
  LD A, C
  SBC A, $7f; z, c
  LD HL, RESULT+$0000
  FRESH A
  SBC A, A; z, c
  LD C, A
  LD A, [HL]
