                      span: (63, 2),
                      statements: [],
                    ),
                  )),
                ),
              )),
            ),
          ],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "fn_with_top_level_yield"
kind = "analyzer"
source = """
fn get_one() -> u8 {
    yield 1;
}

fn main() {
    get_one();
}
"""
expected_errors = [
    "`yield` outside of a block @ [25:33]",
]

