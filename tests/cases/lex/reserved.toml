[[case]]
name = "underscore"
kind = "parser"
entrypoint = "expr"
source = """
_
"""
expected_errors = [
    "Unnamed identifier not permitted here @ [0:1]",
]
expected_ast = """
Expr(
  span: (0, 1),
  data: Place(Place(
    name: ("_", (0, 1)),
    span: (0, 1),
  )),
)
"""

