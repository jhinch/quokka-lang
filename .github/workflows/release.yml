name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:
    - uses: actions/checkout@v7
    - name: Install target
      run: rustup target add ${{ matrix.target }}
    - name: Build
      run: cargo build --release --locked --verbose --bin quokka --target ${{ matrix.target }}
    - name: Package
      run: |
        name="quokka-${GITHUB_REF_NAME}-${{ matrix.target }}"
        mkdir "$name"
        cp "target/${{ matrix.target }}/release/quokka" LICENSE NOTICE README.md "$name/"
        tar -czf "$name.tar.gz" "$name"
        shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        path: quokka-*.tar.gz*
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Publish release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # keep the notes of a release that was created by hand before the tag was pushed
        if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
        fi
        gh release upload "$GITHUB_REF_NAME" dist/* --clobber
