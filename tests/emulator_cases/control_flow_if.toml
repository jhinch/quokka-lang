# Covers `IfExpression`, one shape per case: with/without an `else` branch, condition true/false,
# used as a value-producing expression, and nested ifs.

[[case]]
name = "if_without_else_condition_true"
source = """
global COND: u1;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    COND = 1;
    OUT = 0;
    if COND then {
        OUT = 42;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 42

[[case]]
name = "if_without_else_condition_false"
source = """
global COND: u1;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    COND = 0;
    OUT = 7;
    if COND then {
        OUT = 42;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 7 # the if-body must not have run

