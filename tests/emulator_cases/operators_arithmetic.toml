[[case]]
name = "u16_subtraction_borrow_regression"
source = """
global A: u16;
global B: u16;

#[address = 0xC000]
global BORROW_OUT: u16;
#[address = 0xC002]
global NO_BORROW_OUT: u16;
#[address = 0xC004]
global FULL_WRAP_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    // low byte requires a borrow from the high byte (0x00 - 0x01); with the bug, the high byte's
    // SUB ran before the low byte's, so the borrow never reached the high byte
    A = 0x1000;
    B = 0x0001;
    BORROW_OUT = A - B;

    // no borrow needed, but the bytes are deliberately asymmetric so a high/low byte swap would
    // still be caught
    A = 0x8642;
    B = 0x0111;
    NO_BORROW_OUT = A - B;

    // borrow chains all the way through both bytes
    A = 0x0000;
    B = 0x0001;
    FULL_WRAP_OUT = A - B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0xFF, 0x0F] # 0x0FFF
[[case.assertion]]
addr = 0xC002
expected = [0x31, 0x85] # 0x8531
[[case.assertion]]
addr = 0xC004
expected = [0xFF, 0xFF] # 0xFFFF
