[[case]]
name = "shift_left_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = x <<;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    y#2: u8 = shiftleft x#1
    return
"""

[[case]]
name = "shift_result_type_matches_left_operand"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = x <<;
}
"""
expected_errors = [
    "`u1` is not equal to `u8` @ [47:51]",
]

[[case]]
name = "rotate_left_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let cond: u1 = 1;
    let y: u8 = x <%;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    cond#2: u1 = copy 1
    y#3: u8 = rotateleft x#1
    return
"""
