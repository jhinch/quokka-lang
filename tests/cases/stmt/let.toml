[[case]]
name = "literal_value"
kind = "parser"
entrypoint = "statement"
source = """
let x = 1;
"""
expected_ast = """
Statement(
  span: (0, 10),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    value: Expr(
      span: (8, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "typed_literal_value"
kind = "parser"
entrypoint = "statement"
source = """
let x: u8 = 1;
"""
expected_ast = """
Statement(
  span: (0, 14),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    ty: Some(TyRef(
      span: (7, 2),
      name: ("u8", (7, 2)),
    )),
    value: Expr(
      span: (12, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

