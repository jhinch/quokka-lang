[[case]]
name = "keeps_transfer_and_fill_even_when_results_are_unused"
kind = "analyzer"
optimize = true
preview_features = ["no-canonicalize", "no-sccp", "no-prune"]
source = """
global A: [u8; 20];
global B: [u8; 20];
global C: [u8; 20];

fn main() {
    A = B;
    C = [0; 20];
}
"""
expected_mir = """
global A: [u8; 20]
global B: [u8; 20]
global C: [u8; 20]

@{"entrypoint":true}
main -> unit:
  .bb1:
    transfer A = B
    fill C = [0; 20]
    return
"""

[[case]]
name = "removes_dead_straight_line_computation"
kind = "analyzer"
optimize = true
preview_features = ["no-canonicalize", "no-sccp", "no-prune"]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let dead = n + n;
    return n - 1;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    nop
    #4: u8 = copy 1
    #5: u8 = sub n#2, #4
    #RET: u8 = copy #5
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""

