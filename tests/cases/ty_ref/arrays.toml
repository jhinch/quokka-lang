}
"""
preview_features = [ "array" ]
expected_ast = """
Root(
  items: [
    Item(
      data: StructDecl(StructDecl(
        name: ("Name", (7, 4)),
        fields: [
          FieldDecl(
            name: ("field", (18, 5)),
            ty: TyRef(
              span: (25, 13),
              data: Array(TyRef(
                span: (26, 7),
