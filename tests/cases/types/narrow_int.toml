[[case]]
name = "array_of_u2_requires_narrow_int_even_with_array_enabled"
kind = "analyzer"
source = """
global A: [u2; 3];
fn main() {}
"""
expected_errors = [
    "Preview feature error: use --preview narrow-int @ [11:13]",
]
