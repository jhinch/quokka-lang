[[case]]
name = "reserved_as_let_decl_name"
kind = "parser"
entrypoint = "statement"
source = """
let for = 1;
"""
expected_errors = [
    '"for" is a reserved word @ [4:7]',
]
expected_ast = """
Statement(
  span: (0, 12),
  data: Let(LetSmt(
    name: ("for", (4, 3)),
    value: Expr(
      span: (10, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "reserved_as_fn_decl_name"
kind = "parser"
entrypoint = "item"
source = """
fn match() {}
"""
expected_errors = [
    '"match" is a reserved word @ [3:8]',
]
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("match", (3, 5)),
    ),
    body: Block(
      span: (11, 2),
      statements: [],
    ),
  )),
)
"""

[[case]]
name = "reserved_as_struct_field_name"
kind = "parser"
entrypoint = "item"
source = """
struct S { root: u8 }
"""
expected_errors = [
    '"root" is a reserved word @ [11:15]',
]
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("S", (7, 1)),
    fields: [
      FieldDecl(
        name: ("root", (11, 4)),
        ty: TyRef(
          span: (17, 2),
          data: Simple(("u8", (17, 2))),
        ),
      ),
    ],
  )),
)
"""
