[[case]]
name = "single_u8_global"
kind = "codegen"
source = """
global A: u8;

fn main() {}
"""
expected_lir = """
START_SECTION WRAM0
A::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
main::
.bb1:
  RET

END_SECTION

START_SECTION ROM0[$100]
@CART_HEADER_CODE::
.bb1:
  NOP
  JP @BOOTSTRAP

END_SECTION

START_SECTION ROM0[$104]
@CART_HEADER_DATA::
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
