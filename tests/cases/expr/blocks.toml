[[case]]
name = "empty_block_as_fn_body"
kind = "parser"
entrypoint = "item"
source = """
fn main() {}
"""
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("main", (3, 4)),
    ),
    body: Block(
      span: (10, 2),
      statements: [],
    ),
  )),
)
"""

[[case]]
name = "block_with_multiple_statements"
kind = "parser"
entrypoint = "item"
source = """
fn main() {
    let x = 1;
    x;
}
"""
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("main", (3, 4)),
    ),
    body: Block(
      span: (10, 25),
      statements: [
        Statement(
          span: (16, 10),
          data: Let(LetSmt(
            name: ("x", (20, 1)),
            value: Expr(
              span: (24, 1),
              data: Integer(IntegerLiteral(
                value: 1,
              )),
            ),
          )),
        ),
        Statement(
          span: (31, 2),
          data: Expr(ExprSmt(
            value: Expr(
              span: (31, 1),
              data: Place(Place(
                name: ("x", (31, 1)),
                span: (31, 1),
              )),
            ),
          )),
        ),
      ],
    ),
  )),
)
"""

[[case]]
name = "let_with_type_annotation"
kind = "parser"
entrypoint = "item"
source = """
fn main() {
    let x: u8 = 1;
}
"""
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("main", (3, 4)),
    ),
    body: Block(
      span: (10, 22),
      statements: [
        Statement(
          span: (16, 14),
          data: Let(LetSmt(
            name: ("x", (20, 1)),
            ty: Some(TyRef(
              span: (23, 2),
              data: Simple(("u8", (23, 2))),
            )),
            value: Expr(
              span: (28, 1),
              data: Integer(IntegerLiteral(
                value: 1,
              )),
            ),
          )),
        ),
      ],
    ),
  )),
)
"""

[[case]]
name = "block_as_if_branch"
kind = "parser"
entrypoint = "expr"
source = """
if 1 then {
    loop {
        break;
    }
} else {
}
"""
expected_ast = """
Expr(
  span: (0, 54),
  data: If(If(
    condition: Expr(
      span: (3, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
    true_block: Expr(
      span: (10, 35),
      data: Block(Block(
        span: (10, 35),
        statements: [
          Statement(
            span: (16, 27),
            data: Expr(ExprSmt(
              value: Expr(
                span: (16, 27),
                data: Loop(Loop(
                  body: Block(
                    span: (21, 22),
                    statements: [
                      Statement(
                        span: (31, 6),
                        data: Break(BreakSmt()),
                      ),
                    ],
                  ),
                )),
              ),
            )),
          ),
        ],
      )),
    ),
    false_block: Some(Expr(
      span: (51, 3),
      data: Block(Block(
        span: (51, 3),
        statements: [],
      )),
    )),
  )),
)
"""

