[[case]]
name = "block_as_assignment_rhs_analyzed"
kind = "analyzer"
source = """
global G: u8;

fn main() {
    let x: u8 = 0;
    x = {
        let y = G;
        yield y;
    };
    x += {
        yield 2;
    };
    G = x;
}
"""
expected_mir = """
global G: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    x#1: u8 = copy 0
    y#2: u8 = load G
    #3: u8 = copy 2
    x#4: u8 = add y#2, #3
    store G = x#4
    return
"""

[[case]]
name = "parenthesized_blocks_as_operands_analyzed"
kind = "analyzer"
source = """
global G: u8;

fn main() {
    let x: u8 = ({
        yield G;
    }) + 1;
    G = x - ({
        yield 3;
    });
}
"""
expected_mir = """
global G: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: u8 = load G
    #2: u8 = copy 1
    x#3: u8 = add #1, #2
    #4: u8 = copy 3
    #5: u8 = sub x#3, #4
    store G = #5
    return
"""

