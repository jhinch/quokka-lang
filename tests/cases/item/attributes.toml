[[case]]
name = "attribute_on_const"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
const A: u8 = 1;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: ConstDecl(ConstDecl(
    name: ("A", (24, 1)),
    ty: TyRef(
      span: (27, 2),
      data: Simple(("u8", (27, 2))),
    ),
    value: Expr(
      span: (32, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "attribute_on_global"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
global A: u8;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: GlobalDecl(GlobalDecl(
    name: ("A", (25, 1)),
    ty: TyRef(
      span: (28, 2),
      data: Simple(("u8", (28, 2))),
    ),
  )),
)
"""

[[case]]
name = "missing_closing_bracket"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute
fn main() {}
"""
expected_errors = [
    "Syntax error: found Fn when expecting [RightBracket] @ [17:19]",
]

[[case]]
name = "missing_attribute_name"
kind = "parser"
entrypoint = "item"
source = """
#[]
fn main() {}
"""
expected_errors = [
    "Syntax error: found RightBracket when expecting [Ident] @ [2:3]",
]

[[case]]
name = "entrypoint_defined_on_fn"
kind = "analyzer"
source = """
#[entrypoint]
fn main() {}
"""
expected_mir = """
@FunctionAttributes { entrypoint: true, no_startup_code: false }
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "no_startup_code_on_fn"
kind = "analyzer"
source = """
#[no_startup_code]
fn main() {}
"""
expected_mir = """
@FunctionAttributes { entrypoint: false, no_startup_code: true }
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "unknown_attr_on_function"
kind = "analyzer"
source = """
#[unknown_attr]
fn main() {}
"""
expected_errors = [
    "unknown attribute `unknown_attr` @ [2:14]",
]
