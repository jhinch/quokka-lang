# Valid: the example from the bit-casts reference page.
[[case]]
name = "bit_cast_reference_example"
kind = "analyzer"
source = """
struct BytePair {
    low: u8,
    high: u8,
}

fn main() {
    let a: u16 = 512;
    let b = a as u16;
    let c = b as i16;
    let d = c as BytePair;
    let e = d as [u8; 2];
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u16 = copy 512
    b#2: u16 = bitcast a#1
    c#3: i16 = bitcast b#2
    d#4: BytePair = bitcast c#3
    e#5: [u8; 2] = bitcast d#4
    return
"""

# Valid: a value can always be cast to the type it already is.
[[case]]
name = "bit_cast_to_same_type"
kind = "analyzer"
source = """
fn main() {
    let a: u8 = 1;
    let b = a as u8;
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u8 = copy 1
    b#2: u8 = bitcast a#1
    return
"""

