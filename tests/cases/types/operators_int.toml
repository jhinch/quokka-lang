[[case]]
name = "bitwise_ops_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let a: u8 = x & y;
    let b: u8 = x | y;
    let c: u8 = x ^ y;
}
"""
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto }
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    y#2: u8 = copy 2
    a#3: u8 = bitand x#1, y#2
    b#4: u8 = bitor x#1, y#2
    c#5: u8 = bitxor x#1, y#2
    return
"""
