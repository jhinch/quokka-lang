[[case]]
name = "builtin_const"
kind = "parser"
source = """
const A: u8 = 1;
"""
expected_ast = """
Root(
  items: [
    Item(
      data: ConstDecl(ConstDecl(
        name: ("A", (6, 1)),
        ty: TyRef(
          span: (9, 2),
          name: ("u8", (9, 2)),
        ),
        value: Expr(
          span: (14, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "const_with_expression_value"
kind = "parser"
entrypoint = "item"
source = """
const A: u8 = 1 + 2;
"""
expected_ast = """
Item(
  data: ConstDecl(ConstDecl(
    name: ("A", (6, 1)),
    ty: TyRef(
      span: (9, 2),
      name: ("u8", (9, 2)),
    ),
    value: Expr(
      span: (14, 5),
      data: Binary(BinaryOp(
        kind: Add,
        left: Expr(
          span: (14, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        right: Expr(
          span: (18, 1),
          data: Integer(IntegerLiteral(
            value: 2,
          )),
        ),
      )),
    ),
  )),
)
"""

[[case]]
name = "const_with_attribute"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
const A: u8 = 1;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: ConstDecl(ConstDecl(
    name: ("A", (24, 1)),
    ty: TyRef(
      span: (27, 2),
      name: ("u8", (27, 2)),
    ),
    value: Expr(
      span: (32, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "missing_semicolon"
kind = "parser"
entrypoint = "item"
source = """
const A: u8 = 1
"""
expected_errors = [
    "Syntax error: found Eof when expecting [Semicolon] @ [16:16]",
]

[[case]]
name = "missing_type"
kind = "parser"
entrypoint = "item"
source = """
const A = 1;
"""
expected_errors = [
    "Syntax error: found Equal when expecting [Colon] @ [8:9]",
]
