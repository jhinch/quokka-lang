# Additions and subtractions of a small constant are lowered to `INC`/`DEC` steps instead of an
# addition through the accumulator: `INC r8`/`DEC r8` for an 8-bit `+-1` and `+-2`, and for a
# 16-bit `+-1` a macro instruction stepping the pair a byte at a time. `INC r16`/`DEC r16` corrupt
# OAM when the register holds an address in `$FE00-$FEFF`, so they are only used on addresses
# codegen computed itself into a global placed outside of that range.

[[case]]
name = "add_u8_one_uses_inc"
kind = "codegen"
optimize = true
allocate_registers = true
source = """
global X: u8;
global RESULT: u8;

fn main() {
    RESULT = X + 1;
}
"""
expected_lir = """
START_SECTION WRAM0
X::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0
RESULT::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
main::
.bb1:
  LD HL, X+$0000
  LD A, [HL]
  INC A; z
  LD HL, RESULT+$0000
  LD [HL], A
  RET

END_SECTION

