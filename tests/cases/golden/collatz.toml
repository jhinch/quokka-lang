[[case]]
name = "analyze"
kind = "analyzer"
preview_features = ["function-call", "loop", "if-else"]
source.file = "collatz.q"
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global N: u16
@GlobalDeclAttributes { section: Auto }
global RESULT: u16

collatz_steps -> u16:
  .bb1:
    n#2: u16 = load N
    steps#3: u16 = copy 0
    jump .bb2
  .bb2:
    n#4: u16 = phi n#2 <- .bb1, n#20 <- .bb10
    #5: u16 = copy 1
    #6: u1 = eq n#4, #5
    steps#18: u16 = phi steps#3 <- .bb1, steps#19 <- .bb10
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    #7: u16 = copy 1
    #8: u16 = bitand n#4, #7
    #9: u16 = copy 0
    is_even#10: u1 = eq #8, #9
    jumpif is_even#10 != 0, .bb8, .bb9
  .bb3:
    #RET: u16 = copy steps#18
    return
  .bb8:
    n#11: u16 = shiftright n#4
    jump .bb10
  .bb9:
    #12: u16 = add n#4, n#4
    #13: u16 = add #12, n#4
    #14: u16 = copy 1
    n#15: u16 = add #13, #14
    jump .bb10
  .bb10:
    #16: u16 = copy 1
    steps#17: u16 = copy steps#18
    steps#19: u16 = add steps#18, #16
    n#20: u16 = phi n#11 <- .bb8, n#15 <- .bb9
    jump .bb2

main -> unit:
  .bb1:
    #1: u16 = copy 27
    store N = #1
    call collatz_steps, .bb2
  .bb2:
    #2: u16 = returnvalue
    store RESULT = #2
    return
"""

