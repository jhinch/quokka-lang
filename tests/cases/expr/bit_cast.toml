# Valid: the example from the bit-casts reference page.
[[case]]
name = "bit_cast_reference_example"
kind = "analyzer"
preview_features = [ "bit-cast" ]
ignored = "analyzer does not lower bit casts yet (todo!() in analyze_expr)"
source = """
struct BytePair {
    low: u8,
    high: u8,
}

fn main() {
    let a: u16 = 512;
    let b = a as u16;
    let c = b as i16;
    let d = c as BytePair;
    let e = d as [u8; 2];
}
"""

