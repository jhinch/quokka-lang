[[case]]
name = "analyze"
kind = "analyzer"
source.file = "binary_search.q"
expected_mir = """
@GlobalDeclAttributes { region: Auto, address: None }
global SORTED: [u8; 8]
@GlobalDeclAttributes { region: Auto, address: None }
global TARGET: u8
@GlobalDeclAttributes { region: Auto, address: None }
global FOUND_INDEX: u16

binary_search -> u16:
  .bb1:
    low#2: u16 = copy 0
    high#3: u16 = copy 7
    jump .bb2
  .bb2:
    high#4: u16 = phi high#3 <- .bb1, high#19 <- .bb14
    low#5: u16 = phi low#2 <- .bb1, low#20 <- .bb14
    #6: u1 = lt high#4, low#5
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    #7: u16 = copy 255
    #RET: u16 = copy #7
    return
  .bb5:
    #8: u16 = add low#5, high#4
    mid#9: u16 = shiftright #8
    value#10: u8 = load SORTED[mid#9]
    #11: u8 = load TARGET
    #12: u1 = eq value#10, #11
    jumpif #12 != 0, .bb8, .bb9
  .bb8:
    #RET: u16 = copy mid#9
    return
  .bb9:
    #13: u8 = load TARGET
    #14: u1 = lt value#10, #13
    jumpif #14 != 0, .bb12, .bb13
  .bb12:
    #15: u16 = copy 1
    low#16: u16 = add mid#9, #15
    jump .bb14
  .bb13:
    #17: u16 = copy 1
    high#18: u16 = sub mid#9, #17
    jump .bb14
  .bb14:
    high#19: u16 = phi high#4 <- .bb12, high#18 <- .bb13
    low#20: u16 = phi low#16 <- .bb12, low#5 <- .bb13
    jump .bb2

@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    #1: u16 = copy 0
    #2: u8 = copy 1
    store SORTED[#1] = #2
    #3: u16 = copy 1
    #4: u8 = copy 3
    store SORTED[#3] = #4
    #5: u16 = copy 2
    #6: u8 = copy 4
    store SORTED[#5] = #6
    #7: u16 = copy 3
    #8: u8 = copy 7
    store SORTED[#7] = #8
    #9: u16 = copy 4
    #10: u8 = copy 9
    store SORTED[#9] = #10
    #11: u16 = copy 5
    #12: u8 = copy 12
    store SORTED[#11] = #12
    #13: u16 = copy 6
    #14: u8 = copy 15
    store SORTED[#13] = #14
    #15: u16 = copy 7
    #16: u8 = copy 20
    store SORTED[#15] = #16
    #17: u8 = copy 12
    store TARGET = #17
    call binary_search, .bb2
  .bb2:
    #18: u16 = returnvalue
    store FOUND_INDEX = #18
    return
"""

