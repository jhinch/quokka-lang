preview_features = ["no-adce", "no-sccp", "no-prune", "no-tree-shake"]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let a = n + 5;
    let b = a - 3;
    return b;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    #3: u8 = copy 5
    a#4: u8 = add n#2, #3
    #5: u8 = copy 3
    b#6: u8 = add n#2, 2
    #RET: u8 = copy b#6
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""

