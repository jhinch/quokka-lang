# Covers `==`, `!=`, `<`, `>=` for u8/u16. The u16 case specifically picks operands with equal high
# bytes and a low byte that needs to borrow, since 16-bit comparisons lower to a subtraction with
# carry propagation between the bytes (see operators_arithmetic.toml for the matching `-`
# regression).
#
# Comparisons always produce a u1 result, and a `global: u1` only defines bit 0 of its byte - the
# rest is left as whatever WRAM happened to contain at boot (SameBoy deliberately randomizes
# uninitialized memory, matching real hardware - see docs/src/reference/items/global-items.md on
# globals not being zero-initialized), so every assertion on one masks down to bit 0. The two
# cases at the bottom of this file document two further, separate gaps (`<=`/`>` unimplemented for
# runtime operands, and u1-typed comparison operands hitting a `todo!()`), and stay `ignored`.

[[case]]
name = "comparisons_u8"
source = """
global A: u8;
global B: u8;

#[address = 0xC000]
global EQ_OUT: u1;
#[address = 0xC001]
global NE_OUT: u1;
#[address = 0xC002]
global LT_OUT: u1;
#[address = 0xC003]
global GE_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 10;
    B = 20;
    EQ_OUT = A == B;
    NE_OUT = A != B;
    LT_OUT = A < B;
    GE_OUT = A >= B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 0
mask = 0b0000_0001

[[case]]
name = "comparisons_u16"
source = """
global A: u16;
global B: u16;

#[address = 0xC000]
global EQ_OUT: u1;
#[address = 0xC001]
global NE_OUT: u1;
#[address = 0xC002]
global LT_OUT: u1;
#[address = 0xC003]
global GE_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    // equal high bytes (0x10), low byte of A is less than low byte of B, so evaluating this
    // correctly requires the low byte's borrow to propagate into the high byte comparison
    A = 0x1000;
    B = 0x1001;
    EQ_OUT = A == B;
    NE_OUT = A != B;
    LT_OUT = A < B;
    GE_OUT = A >= B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 0
mask = 0b0000_0001

