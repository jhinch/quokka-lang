[[case]]
name = "empty_struct"
kind = "parser"
entrypoint = "item"
source = """
struct Name {}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: Spanned(
      data: "Name",
      span: SourceSpan(
        offset: SourceOffset(7),
        length: 4,
      ),
    ),
    fields: [],
  )),
)
"""

[[case]]
