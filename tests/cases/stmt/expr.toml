[[case]]
name = "field_access"
kind = "parser"
entrypoint = "statement"
source = """
a.b;
"""
expected_ast = """
Statement(
  span: (0, 4),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 3),
      data: Place(Place(
        name: ("a", (0, 1)),
        span: (0, 3),
        projections: [
          Field(("b", (2, 1))),
        ],
      )),
    ),
  )),
)
"""

[[case]]
name = "array_index"
kind = "parser"
entrypoint = "statement"
source = """
a[0];
"""
expected_ast = """
Statement(
  span: (0, 5),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 4),
      data: Place(Place(
        name: ("a", (0, 1)),
        span: (0, 4),
        projections: [
          Index(Expr(
            span: (2, 1),
            data: Integer(IntegerLiteral(
              value: 0,
            )),
          )),
        ],
      )),
    ),
  )),
)
"""

