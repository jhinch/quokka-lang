[[case]]
name = "eq_u16"
source = """
global LEFT: u16;
global RIGHT: u16;

#[address = 0xC000]
global OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    // equal high bytes (0x10), low byte of LEFT is less than low byte of RIGHT, so evaluating this
    // correctly requires the low byte's borrow to propagate into the high byte comparison
    LEFT = 0x1000;
    RIGHT = 0x1001;
    let left = LEFT;
    let right = RIGHT;
    OUT = left == right;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001

