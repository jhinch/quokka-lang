[[case]]
name = "array_item_type_mismatch"
kind = "analyzer"
preview_features = ["array"]
ignored = false
source = """
global A: [u8; 3];
fn main() {
    let idx: u8 = 0;
    let v: u1 = A[idx];
}
"""
expected_errors = [
    "`u8` is not equal to `u16` @ [70:73]",
    "`u1` is not equal to `u8` @ [68:74]",
]

