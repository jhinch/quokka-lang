# The empty nested if leaves a block with nothing live in it inside the outer arm, which also
# assigns a variable read after the outer if.
[[case]]
name = "if_holding_an_empty_nested_if_assigns_a_variable_read_after_it"
source = """
global A: u8;
global B: u8;

#[address = 0xC000]
global R: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x12;
    B = 0x34;
    let a = A;
    let r = B;
    if a < a then {
        r = a + 1;
        if r != a then {
        }
    }
    R = r;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x34

