[[case]]
name = "attribute_on_const"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
const A: u8 = 1;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      span: (0, 17),
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: ConstDecl(ConstDecl(
    name: ("A", (24, 1)),
    ty: TyRef(
      span: (27, 2),
      data: Simple(("u8", (27, 2))),
    ),
    value: Expr(
      span: (32, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "attribute_on_global"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
global A: u8;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      span: (0, 17),
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: GlobalDecl(GlobalDecl(
    name: ("A", (25, 1)),
    ty: TyRef(
      span: (28, 2),
      data: Simple(("u8", (28, 2))),
    ),
  )),
)
"""

[[case]]
name = "missing_closing_bracket"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute
fn main() {}
"""
expected_errors = [
    "Syntax error: found fn when expecting ] @ [17:19]",
]

