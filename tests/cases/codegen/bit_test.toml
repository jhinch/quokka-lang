# Instruction selection of single-bit mask tests. `(x & m) == 0` and `(x & m) != 0` with a
# single-bit literal `m` are selected as a `BIT` of `x`, so the compare reads neither the `AND`
# nor the zero. Each of those is only lowered if something else still reads it. A compare with the
# mask itself (`(x & m) == m`) only becomes a `BIT` once canonicalize has rewritten it to a compare
# with zero, as it does a compare that reads the carry flag (`(x & m) >= 1`), which is also what a
# mask named by a `const` passes through before the `const` is inlined.

