[[case]]
name = "fn_with_attribute"
kind = "parser"
source = """
#[no_startup_code]
fn main() -> never {
    loop {}
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 18),
          name: ("no_startup_code", (2, 15)),
        ),
      ],
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (22, 4)),
          ty: Some(TyRef(
            span: (32, 5),
            data: Simple(("never", (32, 5))),
          )),
        ),
        body: Block(
          span: (38, 15),
          statements: [
            Statement(
              span: (44, 7),
              data: Expr(ExprSmt(
                value: Expr(
                  span: (44, 7),
                  data: Loop(Loop(
                    body: Block(
                      span: (49, 2),
                      statements: [],
                    ),
                  )),
                ),
              )),
            ),
          ],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "fn_with_multiple_attributes"
kind = "parser"
source = """
#[no_startup_code]
#[entrypoint]
fn main() -> never {
    loop {}
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 18),
          name: ("no_startup_code", (2, 15)),
        ),
        AttributeDecl(
          span: (19, 13),
          name: ("entrypoint", (21, 10)),
        ),
      ],
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (36, 4)),
          ty: Some(TyRef(
            span: (46, 5),
            data: Simple(("never", (46, 5))),
