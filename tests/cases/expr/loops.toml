[[case]]
name = "nested_loop"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
ignored = false
source = """
loop {
    loop {
        break;
    }
}
"""
expected_ast = """
Loop(Loop(
  body: Block(
    statements: [
      Expr(ExprSmt(
        value: Loop(Loop(
          body: Block(
            statements: [
              Break(BreakSmt()),
            ],
          ),
        )),
      )),
    ],
  ),
))
"""

