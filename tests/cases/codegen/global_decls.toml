data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
END_SECTION

START_SECTION ROM0
@BOOTSTRAP::
.bb1:
  LD SP, $fffe
  CALL main; return=.bb2

.bb2:
  JP .bb2

END_SECTION
"""

