[[case]]
name = "equal"
kind = "parser"
entrypoint = "expr"
source = """
1 == 1
"""
expected_ast = """
Binary(BinaryOp(
  kind: Equal,
  left: Integer((IntegerLiteral(
    value: 1,
  ), 0, 1)),
  right: Integer((IntegerLiteral(
    value: 1,
  ), 5, 1)),
))
"""

