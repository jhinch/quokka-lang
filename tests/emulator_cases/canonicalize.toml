# Covers the shapes canonicalization rewrites which span more than one instruction or block: named
# `const` operands, branches on comparisons it folds to a constant, definitions read from another
# block, long chains and signed comparisons. Every case runs with canonicalization off and on, so
# the code generated from both the canonical and the source form is checked against one result.

variants = ["default", "no-canonicalize"]

[[case]]
name = "named_const_operands_of_arithmetic"
source = """
const K: u8 = 5;
const ZERO: u8 = 0;
const ONE: u8 = 1;
const TOP: u8 = 255;
global IN: u8;

#[address = 0xC000]
global SUB: u8;
#[address = 0xC001]
global ADD_LEFT: u8;
#[address = 0xC002]
global CHAIN: u8;
#[address = 0xC003]
global NOT: u8;
#[address = 0xC004]
global ADD_ZERO: u8;
#[address = 0xC005]
global NEG: u8;
#[address = 0xC006]
global MASKED: u8;
#[address = 0xC007]
global NOT_PLUS_ONE: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0x35;
    let x = IN;
    SUB = x - K;
    ADD_LEFT = K + x;
    CHAIN = (x + K) + 7;
    NOT = x ^ TOP;
    ADD_ZERO = x + ZERO;
    NEG = ZERO - x;
    MASKED = (x & TOP) | ZERO;
    NOT_PLUS_ONE = !x + ONE;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x30
[[case.assertion]]
addr = 0xC001
expected = 0x3A
[[case.assertion]]
addr = 0xC002
expected = 0x41
[[case.assertion]]
addr = 0xC003
expected = 0xCA
[[case.assertion]]
addr = 0xC004
expected = 0x35
[[case.assertion]]
addr = 0xC005
expected = 0xCB
[[case.assertion]]
addr = 0xC006
expected = 0x35
[[case.assertion]]
addr = 0xC007
expected = 0xCB

