[[case]]
name = "if_condition_not_bool"
kind = "analyzer"
preview_features = ["if-else"]
source = """
fn main() {
    let x: u8 = 1;
    if x then {
    } else {
    }
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [38:39]",
]

[[case]]
name = "if_condition_bool_ok"
kind = "analyzer"
preview_features = ["if-else"]
source = """
fn main() {
    let c: u1 = 1;
    if c then {
    } else {
    }
}
"""
expected_mir = """
main -> unit:
  .bb1:
    c#1: <unresolved> = copy 1
    #2: u1 = copy c#1
    #3: u1 = copy #2
    jumpif #3 != 0, .bb2, .bb3
  .bb2:
    jump .bb4
  .bb3:
    jump .bb4
  .bb4:
    return
"""

