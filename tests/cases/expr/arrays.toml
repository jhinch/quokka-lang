[[case]]
name = "analyzer_array_expr_in_const_decl"
kind = "analyzer"
source = """
const A: [u8; 4] = [1, 2, 3, 4];
fn main() {}
"""
expected_mir = """
const A: [u8; 4] = [1, 2, 3, 4]

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "analyzer_array_expr_in_const_decl_with_inferred_local"
kind = "analyzer"
source = """
const A: [u8; 3] = {
    yield [1, 2, 3];
};
fn main() {}
"""
expected_mir = """
const A: [u8; 3] = [1, 2, 3]

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

[[case]]
