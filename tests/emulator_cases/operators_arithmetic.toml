# Covers the binary operators in `ArithmeticExpression` (`&`, `|`, `^`, `+`, `-`), one operator and
# width per case. Each case binds both operands into `let` locals before applying the operator (so
# there's a genuine local variable to re-read afterwards, rather than a hidden temporary produced by
# reading a global directly - see `docs/src/reference/statements/lets.md`) and asserts three things:
# the result, and that neither operand's local was corrupted by computing it. This specifically
# guards against miscompiles that mutate an operand's register in place instead of producing a fresh
# result register (see e.g. the regalloc fix in `dd7bf9f`).

[[case]]
name = "bitand_u1"
source = """
global LEFT: u1;
global RIGHT: u1;

#[address = 0xC000]
global OUT: u1;
#[address = 0xC001]
global LEFT_OUT: u1;
#[address = 0xC002]
global RIGHT_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 1;
    RIGHT = 1;
    let left = LEFT;
    let right = RIGHT;
    let result = left & right;
    OUT = result;
    LEFT_OUT = left;
    RIGHT_OUT = right;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001

