[[case]]
name = "basic"
kind = "parser"
entrypoint = "statement"
source = """
breakpoint;
"""
expected_ast = """
Statement(
  span: (0, 11),
  data: Breakpoint(BreakpointSmt),
)
"""

[[case]]
name = "missing_semicolon"
kind = "parser"
entrypoint = "statement"
source = """
breakpoint
"""
expected_errors = [
    "Syntax error: missing `;` after `breakpoint` statement @ [10:10]",
]

[[case]]
name = "unexpected_value"
kind = "parser"
entrypoint = "statement"
source = """
breakpoint 1;
"""
expected_errors = [
    "Syntax error: missing `;` after `breakpoint` statement @ [10:10]",
]

[[case]]
name = "keyword_not_allowed_as_identifier"
kind = "parser"
entrypoint = "statement"
source = """
let breakpoint = 1;
"""
expected_errors = [
    "Syntax error: found `breakpoint` when expecting an identifier @ [4:14]",
]

[[case]]
name = "not_allowed_in_expression_position"
kind = "parser"
entrypoint = "expr"
source = """
1 + breakpoint
"""
expected_errors = [
    "Syntax error: found `breakpoint` when expecting an expression @ [4:14]",
]

[[case]]
name = "in_fn_body"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
fn main() {
    breakpoint;
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    breakpoint
    return
"""

[[case]]
name = "requires_preview_feature"
kind = "analyzer"
source = """
fn main() {
    breakpoint;
}
"""
expected_errors = [
    "Preview feature error: use --preview breakpoint @ [16:27]",
]

[[case]]
name = "between_statements"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
global OUT: u8;

fn main() {
    OUT = 1;
    breakpoint;
    OUT = 2;
    breakpoint;
}
"""
expected_mir = """
global OUT: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: u8 = copy 1
    store OUT = #1
    breakpoint
    #2: u8 = copy 2
    store OUT = #2
    breakpoint
    return
"""

[[case]]
name = "in_if_then_branch"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
global IN: u8;

fn main() {
    if IN == 1 then {
        breakpoint;
    }
}
"""
expected_mir = """
global IN: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: u8 = load IN
    #2: u8 = copy 1
    #3: u1 = eq #1, #2
    jumpif #3 != 0, .bb2, .bb3
  .bb2:
    breakpoint
    jump .bb3
  .bb3:
    return
"""

[[case]]
name = "in_loop"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
global OUT: u8;

fn main() {
    loop {
        breakpoint;
        OUT += 1;
        if OUT == 10 then {
            break;
        }
    }
}
"""
expected_mir = """
global OUT: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    jump .bb2
  .bb2:
    breakpoint
    #1: u8 = copy 1
    #2: u8 = load OUT
    #3: u8 = add #2, #1
    store OUT = #3
    #4: u8 = load OUT
    #5: u8 = copy 10
    #6: u1 = eq #4, #5
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    jump .bb2
  .bb3:
    return
"""

[[case]]
name = "in_block_expression"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
global OUT: u8;

fn main() {
    let v: u8 = {
        breakpoint;
        yield 1;
    };
    OUT = v;
}
"""
expected_mir = """
global OUT: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    breakpoint
    v#1: u8 = copy 1
    store OUT = v#1
    return
"""

[[case]]
name = "unreachable_after_return"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
fn main() {
    return;
    breakpoint;
}
"""
expected_errors = [
    "unreachable code @ [28:39]",
]

[[case]]
name = "not_allowed_in_const_decl"
kind = "analyzer"
preview_features = ["breakpoint"]
source = """
const C: u8 = {
    breakpoint;
    yield 1;
};

fn main() {}
"""
expected_errors = [
    "`breakpoint` in a constant declaration @ [20:31]",
]

[[case]]
name = "not_allowed_in_const_decl_without_preview_feature"
kind = "analyzer"
source = """
const C: u8 = {
    breakpoint;
    yield 1;
};

fn main() {}
"""
expected_errors = [
    "Preview feature error: use --preview breakpoint @ [20:31]",
    "`breakpoint` in a constant declaration @ [20:31]",
]
