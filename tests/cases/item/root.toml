[[case]]
name = "empty_root"
kind = "parser"
entrypoint = "root"
source = """
"""
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "multiple_items"
kind = "parser"
entrypoint = "root"
source = """
const A: u8 = 1;
global B: u8;
fn main() {}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: ConstDecl(ConstDecl(
        name: Spanned(
          data: "A",
          span: SourceSpan(
            offset: SourceOffset(6),
            length: 1,
          ),
        ),
        ty: TyRef(
          name: Spanned(
            data: "u8",
            span: SourceSpan(
              offset: SourceOffset(9),
              length: 2,
            ),
          ),
        ),
        value: Expr(
          span: SourceSpan(
            offset: SourceOffset(14),
            length: 1,
          ),
          data: Integer(Spanned(
            data: IntegerLiteral(
              value: 1,
            ),
            span: SourceSpan(
              offset: SourceOffset(14),
              length: 1,
            ),
          )),
        ),
      )),
    ),
    Item(
      data: GlobalDecl(GlobalDecl(
        name: Spanned(
          data: "B",
          span: SourceSpan(
            offset: SourceOffset(24),
            length: 1,
          ),
        ),
        ty: TyRef(
          name: Spanned(
            data: "u8",
            span: SourceSpan(
              offset: SourceOffset(27),
              length: 2,
            ),
          ),
        ),
      )),
    ),
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: Spanned(
            data: "main",
            span: SourceSpan(
              offset: SourceOffset(34),
              length: 4,
            ),
          ),
        ),
        body: Block(
          statements: [],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "invalid_item_start"
kind = "parser"
entrypoint = "root"
source = """
let x = 1;
"""
expected_errors = [
    "Syntax error: found Let when expecting [Fn, Global, Const, Struct] @ [0:3]",
]
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "error_recovery_skips_to_next_item"
kind = "parser"
entrypoint = "root"
source = """
1 + 1
fn ok() {}
weird_token
"""
expected_errors = [
    "Syntax error: found Number when expecting [Fn, Global, Const, Struct] @ [0:1]",
    "Syntax error: found Ident when expecting [Fn, Global, Const, Struct] @ [17:28]",
]
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: Spanned(
            data: "ok",
            span: SourceSpan(
              offset: SourceOffset(9),
              length: 2,
            ),
          ),
        ),
        body: Block(
          statements: [],
        ),
      )),
    ),
  ],
)
"""
