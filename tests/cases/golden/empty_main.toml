[[case]]
name = "lex"
kind = "lexer"
source = """
fn main() {}
"""
expected_tokens = """
Fn:fn
Ident:main
LeftParen:(
RightParen:)
LeftBrace:{
RightBrace:}
Eof:
"""

[[case]]
name = "parse"
kind = "parser"
source = """
fn main() {}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (3, 4)),
        ),
        body: Block(
          span: (10, 2),
          statements: [],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "analyze"
kind = "analyzer"
source = """
fn main() {}
"""
expected_mir = """
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "codegen"
kind = "codegen"
source = """
fn main() {}
"""
expected_lir = """
START_SECTION ROM0
main::
.bb1:
  RET

END_SECTION
"""
