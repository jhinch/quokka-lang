[[case]]
name = "nested_loop_inner_break_via_if"
kind = "analyzer"
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let total = 0;
    let i = 0;
    loop {
        if i == n then {
            break;
        }
        let j = 0;
        loop {
            if j == n then {
                break;
            }
            total += 1;
            j += 1;
        }
        i += 1;
    }
    return total;
}

fn main() {}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    total#3: u8 = copy 0
    i#4: u8 = copy 0
    jump .bb2
  .bb2:
    i#5: u8 = phi i#4 <- .bb1, i#20 <- .bb9
    n#6: u8 = copy n#2
    #7: u1 = eq i#5, n#6
    total#17: u8 = phi total#3 <- .bb1, total#13 <- .bb9
    jumpif #7 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    j#8: u8 = copy 0
    jump .bb8
  .bb3:
    #RET: u8 = copy total#17
    return
  .bb8:
    j#9: u8 = phi j#8 <- .bb5, j#16 <- .bb11
    n#10: u8 = copy n#6
    #11: u1 = eq j#9, n#10
    total#13: u8 = phi total#17 <- .bb5, total#14 <- .bb11
    i#19: u8 = copy i#5
    jumpif #11 != 0, .bb10, .bb11
  .bb10:
    jump .bb9
  .bb11:
    #12: u8 = copy 1
    total#14: u8 = add total#13, #12
    #15: u8 = copy 1
    j#16: u8 = add j#9, #15
    jump .bb8
  .bb9:
    #18: u8 = copy 1
    i#20: u8 = add i#5, #18
    jump .bb2

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""
