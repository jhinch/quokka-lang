# Covers the `AssignExpression` compound operators (`+=`, `-=`, `&=`, `|=`, `^=`), one operator and
# width per case. These mutate the target local in place, which is exactly the codegen path that
# previously mutated a register in place instead of producing a fresh result (see the regalloc fix
# in `dd7bf9f`), so each case also checks that the right-hand operand's local was not corrupted by
# the in-place mutation of the target.

[[case]]
name = "add_assign_u1"
source = """
global A: u1;
global RHS: u1;

#[address = 0xC000]
global OUT: u1;
#[address = 0xC001]
global RHS_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    RHS = 1;
    let a = A;
    let rhs = RHS;
    a += rhs;
    OUT = a;
    RHS_OUT = rhs;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0 # 1 + 1 wraps to 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001

