[[case]]
name = "shift_left_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = x <<;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    #2: u8 = copy x#1
    #3: u8 = shiftleft #2
    y#4: u8 = copy #3
    return
"""

[[case]]
name = "shift_result_type_matches_left_operand"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = x <<;
}
"""
expected_errors = [
    "`u1` is not equal to `u8` @ [47:51]",
]

[[case]]
name = "rotate_left_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let cond: u1 = 1;
    let y: u8 = x <%;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    cond#2: <unresolved> = copy 1
    #3: u8 = copy x#1
    #4: u8 = rotateleft #3
    y#5: u8 = copy #4
    return
"""
