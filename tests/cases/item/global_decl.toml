[[case]]
name = "builtin_global"
kind = "parser"
source = """
global A: u8;
"""
expected_ast = """
Root(
  items: [
    Item(
      data: GlobalDecl(GlobalDecl(
        name: Spanned(
          data: "A",
          span: SourceSpan(
            offset: SourceOffset(7),
            length: 1,
          ),
        ),
        ty: TyRef(
          name: Spanned(
            data: "u8",
            span: SourceSpan(
              offset: SourceOffset(10),
              length: 2,
            ),
          ),
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "global_with_attribute"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
global A: u8;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: Spanned(
        data: "this_attribute",
        span: SourceSpan(
          offset: SourceOffset(2),
          length: 14,
        ),
      ),
    ),
  ],
  data: GlobalDecl(GlobalDecl(
    name: Spanned(
      data: "A",
      span: SourceSpan(
        offset: SourceOffset(25),
        length: 1,
      ),
    ),
    ty: TyRef(
      name: Spanned(
        data: "u8",
        span: SourceSpan(
          offset: SourceOffset(28),
          length: 2,
        ),
      ),
    ),
  )),
)
"""

[[case]]
name = "missing_type"
kind = "parser"
entrypoint = "item"
source = """
global A;
"""
expected_errors = [
    "Syntax error: found Semicolon when expecting [Colon] @ [8:9]",
]

[[case]]
name = "missing_semicolon"
kind = "parser"
entrypoint = "item"
source = """
global A: u8
"""
expected_errors = [
    "Syntax error: found Eof when expecting [Semicolon] @ [13:13]",
]
