[[case]]
name = "add_matching_types_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let z: u8 = x + y;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    y#2: <unresolved> = copy 2
    #3: u8 = copy x#1
    #4: u8 = copy y#2
    #5: <unresolved> = add #3, #4
    z#6: <unresolved> = copy #5
    return
"""

[[case]]
name = "add_mismatched_types_error"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = 1;
    let z = x + y;
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [66:67]",
]

[[case]]
name = "unary_not_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u1 = 1;
    let y: u1 = !x;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    #2: u1 = copy x#1
    #3: u1 = not #2
    y#4: u1 = copy #3
    return
"""

[[case]]
name = "unary_neg_on_unsigned_concrete_type_is_error"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = -x;
}
"""
expected_errors = [
    "`u8` is not a signed integer type @ [47:49]",
]

[[case]]
name = "unary_neg_on_signed_concrete_type_ok"
kind = "analyzer"
source = """
fn main() {
    let x: i8 = 1;
    let y: i8 = -x;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    #2: i8 = copy x#1
    #3: i8 = neg #2
    y#4: i8 = copy #3
    return
"""

[[case]]
name = "unary_neg_on_deferred_unsigned_type_variable"
kind = "analyzer"
source = """
fn main() {
    let x = 1;
    let y = -x;
    let z: u8 = x;
}
"""
expected_errors = [
    "`u8` is not a signed integer type @ [39:41]",
]

[[case]]
name = "bitwise_ops_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let a: u8 = x & y;
    let b: u8 = x | y;
    let c: u8 = x ^ y;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    y#2: <unresolved> = copy 2
    #3: u8 = copy x#1
    #4: u8 = copy y#2
    #5: <unresolved> = bitand #3, #4
    a#6: <unresolved> = copy #5
    #7: u8 = copy x#1
    #8: u8 = copy y#2
    #9: <unresolved> = bitor #7, #8
    b#10: <unresolved> = copy #9
    #11: u8 = copy x#1
    #12: u8 = copy y#2
    #13: <unresolved> = bitxor #11, #12
    c#14: <unresolved> = copy #13
    return
"""
