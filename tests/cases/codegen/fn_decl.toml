[[case]]
name = "fn_addr_gets_own_pinned_section"
kind = "codegen"
source = """
#[address = 0x0150]
fn checkpoint() {}

fn main() {}
"""
expected_lir = """
START_SECTION ROM0
main::
.bb1:
  RET

END_SECTION

START_SECTION ROM0[$150]
checkpoint::
.bb1:
  RET

END_SECTION

START_SECTION ROM0[$100]
@CART_HEADER_CODE::
.bb1:
  NOP
  JP @BOOTSTRAP

END_SECTION

START_SECTION ROM0[$104]
@CART_HEADER_DATA::
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
