[[case]]
name = "grouped_comparison_chain_allowed"
kind = "parser"
entrypoint = "expr"
source = """
(1 == 1) == (2 == 2)
"""
expected_ast = """
Binary(BinaryOp(
  kind: Equal,
  left: Paren(Binary(BinaryOp(
    kind: Equal,
    left: Integer((IntegerLiteral(
      value: 1,
    ), 1, 1)),
    right: Integer((IntegerLiteral(
      value: 1,
    ), 6, 1)),
  ))),
  right: Paren(Binary(BinaryOp(
    kind: Equal,
    left: Integer((IntegerLiteral(
      value: 2,
    ), 13, 1)),
    right: Integer((IntegerLiteral(
      value: 2,
    ), 18, 1)),
  ))),
))
"""
