# Covers u16/i16 binary operators whose right operand is a literal. Codegen lowers these to byte
# pairs using the `n8` immediate forms (`ADD`/`ADC`/`SUB`/`SBC`/`AND`/`OR`/`XOR A,n8`), so the cases
# pick literals whose bytes are 0x00/0xFF in each position and left operands that exercise the
# carry/borrow between the low and high byte. Each case also asserts the left operand's local wasn't
# corrupted by computing the result.

[[case]]
name = "add_u16_literal_low_byte_carry"
source = """
global LEFT: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global LEFT_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 0x12FF;
    let left = LEFT;
    let result = left + 0x0001;
    OUT = result;
    LEFT_OUT = left;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x00, 0x13] # 0x1300
[[case.assertion]]
addr = 0xC002
expected = [0xFF, 0x12] # 0x12FF

