[[case]]
name = "if_else_as_value_producing_expression"
source = """
global COND: u1;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    COND = 1;
    let result: u8 = if COND then {
        yield 10;
    } else {
        yield 20;
    };
    OUT = result;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 10

[[case]]
name = "nested_if_inner_condition_gates_outer_body"
source = """
global OUTER: u1;
global INNER: u1;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    OUTER = 1;
    INNER = 1;
    OUT = 0;
    if OUTER then {
        if INNER then {
            OUT = 99;
        }
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 99

[[case]]
name = "nested_if_outer_false_skips_inner"
source = """
global OUTER: u1;
global INNER: u1;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global INNER_BODY_RAN: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    OUTER = 0;
    INNER = 1;
    OUT = 5;
    INNER_BODY_RAN = 0;
    if OUTER then {
        if INNER then {
            INNER_BODY_RAN = 1;
        }
        OUT = 99;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 5 # outer body, including the nested if, must not have run
[[case.assertion]]
addr = 0xC001
expected = 0
mask = 0b0000_0001

# After `r = s` both variables leave the then branch holding the same value, so one block feeds
# that value into two phis at the join.
[[case]]
name = "if_copies_one_variable_into_another_taken"
source = """
global A: u8;
global B: u8;

#[address = 0xC000]
global R: u8;
#[address = 0xC001]
global S: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x12;
    B = 7;
    let a = A;
    let b = B;
    let r = a;
    let s = a;
    if b == 7 then {
        s = b;
        r = s;
    }
    R = r;
    S = s;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 7
[[case.assertion]]
addr = 0xC001
expected = 7

