name = "seven_link_add_chain_converges_with_the_full_optimizer"
kind = "analyzer"
optimize = true
source = """
global N: u8;
global A: u8;
global B: u8;
global C: u8;

fn f() -> u8 {
    let n = N;
    let a = A;
    let b = B;
    let c = C;
    return ((((((n + 1) + a) + 2) + b) + 3) + c) + 4;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8
global A: u8
global B: u8
global C: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    a#3: u8 = load A
    b#4: u8 = load B
    c#5: u8 = load C
    #7: u8 = add n#2, a#3
    #10: u8 = add #7, b#4
    #13: u8 = add #10, c#5
    #16: u8 = add #13, 10
    #RET: u8 = copy #16
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""

