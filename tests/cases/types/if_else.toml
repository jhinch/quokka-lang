[[case]]
name = "if_branches_mismatched_types"
kind = "analyzer"
preview_features = ["if-else"]
source = """
fn main() {
    let c: u1 = 1;
    let a: u8 = 1;
    let b: u1 = 1;
    let r = if c then { yield a; } else { yield b; };
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [109:121]",
    "`u8` is not equal to `u1` @ [109:121]",
]

[[case]]
name = "if_branches_matching_types_ok"
kind = "analyzer"
preview_features = ["if-else"]
source = """
fn main() {
    let c: u1 = 1;
    let a: u8 = 1;
    let b: u8 = 2;
    let r: u8 = if c then { yield a; } else { yield b; };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    c#1: <unresolved> = copy 1
    a#2: <unresolved> = copy 1
    b#3: <unresolved> = copy 2
    #4: u1 = copy c#1
    #5: u1 = copy #4
    jumpif #5 != 0, .bb2, .bb3
  .bb2:
    #6: u8 = copy a#2
    #7: u8 = copy #6
    #8: <unresolved> = copy #7
    jump .bb4
  .bb3:
    #9: u8 = copy b#3
    #10: u8 = copy #9
    #11: <unresolved> = copy #10
    jump .bb4
  .bb4:
    #12: <unresolved> = phi #8 <- .bb2, #11 <- .bb3
    r#13: <unresolved> = copy #12
    return
"""

