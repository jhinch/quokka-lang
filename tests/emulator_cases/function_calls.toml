[[case]]
name = "caller_locals_live_across_call_survive_register_pressure"
source = """
global A: u8;
global B: u8;
global C: u8;
global D: u8;

#[address = 0xC000]
global OUT_A: u8;
#[address = 0xC001]
global OUT_B: u8;
#[address = 0xC002]
global OUT_C: u8;
#[address = 0xC003]
global OUT_D: u8;
#[address = 0xC004]
global OUT_HELPER: u8;

fn helper() -> u8 {
    let p = 0x01;
    let q = 0x02;
    let r = 0x03;
    let s = 0x04;
    let t = p + q + r + s;
    return t;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    B = 2;
    C = 3;
    D = 4;
    let a = A;
    let b = B;
    let c = C;
    let d = D;
    let h = helper();
    OUT_A = a;
    OUT_B = b;
    OUT_C = c;
    OUT_D = d;
    OUT_HELPER = h;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
[[case.assertion]]
addr = 0xC001
expected = 2
[[case.assertion]]
addr = 0xC002
expected = 3
[[case.assertion]]
addr = 0xC003
expected = 4
[[case.assertion]]
addr = 0xC004
expected = 10

