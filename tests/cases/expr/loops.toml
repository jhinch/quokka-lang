[[case]]
name = "loop_with_yield_fails_analysis"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    loop {
        yield 1;
    }
}
"""
expected_errors = [
    "`yield` outside of a block @ [31:39]",
]

[[case]]
name = "nested_loop"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
source = """
loop {
    loop {
        break;
    }
}
"""
expected_ast = """
Expr(
  span: (0, 40),
  data: Loop(Loop(
    body: Block(
      span: (5, 35),
      statements: [
        Statement(
          span: (11, 27),
          data: Expr(ExprSmt(
            value: Expr(
              span: (11, 27),
              data: Loop(Loop(
                body: Block(
                  span: (16, 22),
                  statements: [
                    Statement(
                      span: (26, 6),
                      data: Break(BreakSmt()),
                    ),
                  ],
                ),
              )),
            ),
          )),
        ),
      ],
    ),
  )),
)
"""

