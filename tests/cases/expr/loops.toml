[[case]]
name = "loop_continue_via_if_no_else"
kind = "analyzer"
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    let sum = 0;
    loop {
        if i == n then {
            break;
        }
        i += 1;
        if i == 5 then {
            continue;
        }
        sum += i;
    }
    return sum;
}

fn main() {}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    i#3: u8 = copy 0
    sum#4: u8 = copy 0
    jump .bb2
  .bb2:
    i#5: u8 = phi i#3 <- .bb1, i#9 <- .bb8, i#9 <- .bb9
    n#6: u8 = copy n#2
    #7: u1 = eq i#5, n#6
    sum#12: u8 = phi sum#4 <- .bb1, sum#12 <- .bb8, sum#13 <- .bb9
    jumpif #7 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    #8: u8 = copy 1
    i#9: u8 = add i#5, #8
    #10: u8 = copy 5
    #11: u1 = eq i#9, #10
    jumpif #11 != 0, .bb8, .bb9
  .bb3:
    #RET: u8 = copy sum#12
    return
  .bb8:
    jump .bb2
  .bb9:
    sum#13: u8 = add sum#12, i#9
    jump .bb2

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

