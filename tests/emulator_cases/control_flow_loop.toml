[[case]]
name = "loop_assignment_before_break_via_if_is_kept"
source = """
#[address = 0xC000]
global IN: u8;

#[address = 0xC001]
global OUT: u8;

#[address = 0xC002]
global C: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 10;
    C = 0;
    let r = IN;
    loop {
        r = r + 1;
        C = C + 1;
        if C == 3 then {
            break;
        }
    }
    OUT = r;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC001
