[[case]]
name = "lex"
kind = "lexer"
source.file = "empty_main.q"
expected_tokens = """
Fn:fn
Ident:main
LeftParen:(
RightParen:)
LeftBrace:{
RightBrace:}
Eof:
"""

[[case]]
name = "parse"
kind = "parser"
source.file = "empty_main.q"
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (3, 4)),
        ),
        body: Block(
          span: (10, 2),
          statements: [],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "analyze"
kind = "analyzer"
source.file = "empty_main.q"
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    return
"""

