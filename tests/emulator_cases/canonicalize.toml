[[case]]
name = "named_const_branch_conditions"
source = """
const K: u8 = 5;
const MASK: u8 = 0b0000_1000;
global IN: u8;

#[address = 0xC000]
global BELOW: u8;
#[address = 0xC001]
global ABOVE: u8;
#[address = 0xC002]
global SUM: u8;
#[address = 0xC003]
global BIT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    BELOW = 0;
    ABOVE = 0;
    SUM = 0;
    BIT = 0;
    IN = 0x2C;
    let x = IN;
    if x < K then {
        BELOW = 1;
    }
    if K < x then {
        ABOVE = 1;
    }
    if x - K == 0x27 then {
        SUM = 1;
    }
    if (x & MASK) >= 1 then {
        BIT = 1;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
[[case.assertion]]
addr = 0xC001
expected = 1
[[case.assertion]]
addr = 0xC002
expected = 1
[[case.assertion]]
addr = 0xC003
expected = 1

# None of the conditions depends on its operand, which canonicalization finds and the source form
# leaves for the comparison to work out at runtime.
[[case]]
name = "constant_conditions_guarding_assignments"
source = """
global N: u8;
global M: u8;
global S: i8;

#[address = 0xC000]
global NEVER: u8;
#[address = 0xC001]
global ALWAYS: u8;
#[address = 0xC002]
global ELSE_ARM: u8;
#[address = 0xC003]
global SELF: u8;
#[address = 0xC004]
global SIGNED: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    N = 7;
    M = 0x20;
    S = -1;
    let n = N;
    let m = M;
    let s = S;

    let never = m;
    if n < 0 then {
        never = m + 1;
    }
    NEVER = never;

    let always = m;
    if n >= 0 then {
        always = m + 1;
    }
    ALWAYS = always;

    let arm = m;
    if 255 < n then {
        arm = m + 1;
    } else {
        arm = m - 1;
    }
    ELSE_ARM = arm;

    let same = 0;
    if n != n then {
        same = 1;
    } else {
        same = 2;
    }
    SELF = same;

    let signed = 0;
    if s < -128 then {
        signed = 1;
    } else {
        signed = 3;
    }
    SIGNED = signed;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x20
[[case.assertion]]
addr = 0xC001
expected = 0x21
[[case.assertion]]
addr = 0xC002
expected = 0x1F
[[case.assertion]]
addr = 0xC003
expected = 2
[[case.assertion]]
addr = 0xC004
expected = 3

[[case]]
name = "constant_true_condition_guarding_a_loop_exit"
source = """
global N: u8;
global M: u8;

#[address = 0xC000]
global ONCE: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    N = 7;
    M = 0x20;
    let n = N;
    let m = M;
    let once = m;
    loop {
        once = once + n;
        if n >= 0 then {
            break;
        }
        once = once ^ 255;
    }
    ONCE = once;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x27

# 0x20 + 7 = 0x27, ^ 0 = 0x27; + 7 = 0x2E, ^ 1 = 0x2F; + 7 = 0x36, ^ 2 = 0x34.
[[case]]
name = "constant_false_condition_guarding_a_loop_exit"
max_instructions = 2000
source = """
global N: u8;
global M: u8;

#[address = 0xC000]
global COUNTED: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    N = 7;
    M = 0x20;
    let n = N;
    let m = M;
    let counted = m;
    let i = 0;
    loop {
        if n < 0 then {
            break;
        }
        counted = (counted + n) ^ i;
        i = i + 1;
        if i == 3 then {
            break;
        }
    }
    COUNTED = counted;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x34

