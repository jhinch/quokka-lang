[[case]]
name = "grouped_number"
kind = "parser"
entrypoint = "expr"
source = """
(1)
"""
expected_ast = """
Expr(
  span: (0, 3),
  data: Paren(Expr(
    span: (1, 1),
    data: Integer(IntegerLiteral(
      value: 1,
    )),
  )),
)
"""

[[case]]
name = "grouped_overrides_precedence"
kind = "parser"
entrypoint = "expr"
source = """
(1 + 2) <<
"""
expected_ast = """
Expr(
  span: (0, 10),
  data: Unary(UnaryOp(
    kind: ShiftLeft,
    expr: Expr(
      span: (0, 7),
      data: Paren(Expr(
        span: (1, 5),
        data: Arithmetic(ArithmeticOp(
          kind: Add,
          left: Expr(
            span: (1, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (5, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "grouped_allows_chained_comparison"
kind = "parser"
entrypoint = "expr"
source = """
(1 == 1) == (2 == 2)
"""
expected_ast = """
Expr(
  span: (0, 20),
  data: Comparison(ComparisonOp(
    kind: Eq,
    left: Expr(
      span: (0, 8),
      data: Paren(Expr(
        span: (1, 6),
        data: Comparison(ComparisonOp(
          kind: Eq,
          left: Expr(
            span: (1, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (6, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
        )),
      )),
    ),
    right: Expr(
      span: (12, 8),
      data: Paren(Expr(
        span: (13, 6),
        data: Comparison(ComparisonOp(
          kind: Eq,
          left: Expr(
            span: (13, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
          right: Expr(
            span: (18, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "nested_grouped"
kind = "parser"
entrypoint = "expr"
source = """
((1))
"""
expected_ast = """
Expr(
  span: (0, 5),
  data: Paren(Expr(
    span: (1, 3),
    data: Paren(Expr(
      span: (2, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    )),
  )),
)
"""

[[case]]
name = "missing_closing_paren"
kind = "parser"
entrypoint = "expr"
source = """
(1
"""
expected_errors = [
    "Syntax error: found end of file when expecting `)` @ [3:3]",
]
