[[case]]
name = "ge_zero_guarding_a_loop_exit_removes_the_loop_with_the_full_optimizer"
kind = "analyzer"
optimize = true
source = """
global N: u8;
global M: u8;

fn f() -> u8 {
    let n = N;
    let m = M;
    let r = m;
    loop {
        r = r + n;
        if n >= 0 then {
            break;
        }
        r = r ^ 255;
    }
    return r;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8
global M: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    m#3: u8 = load M
    r#4: u8 = copy m#3
    r#5: u8 = copy r#4
    n#6: u8 = copy n#2
    r#7: u8 = add r#5, n#6
    #RET: u8 = copy r#7
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""
