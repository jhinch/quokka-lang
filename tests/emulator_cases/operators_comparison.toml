# Covers `==`, `!=`, `<`, `>=` for u8/u16, one operator per case, each binding both operands into
# `let` locals first and checking the result plus that one of the operands was not corrupted by the
# comparison (in a separate "_left_preserved"/"_right_preserved" case per operand, rather than
# checking both operands live in the same case - see the comment in `spill_reload_regressions.toml`
# for why keeping every local simultaneously live can, by itself, trigger an unrelated pre-existing
# register-allocator bug). The u16 cases specifically pick operands with equal high bytes and a low
# byte that needs to borrow, since 16-bit comparisons lower to a subtraction with carry propagation
# between the bytes (see operators_arithmetic.toml for the matching `-` regression), and a separate
# group of cases re-checks the same operators with equal operands (the edge case where the borrow
# chain must propagate all the way through both bytes without ever going negative).
#
# Comparisons always produce a u1 result, and a `global: u1` only defines bit 0 of its byte - the
# rest is left as whatever WRAM happened to contain at boot (SameBoy deliberately randomizes
# uninitialized memory, matching real hardware - see docs/src/reference/items/global-items.md on
# globals not being zero-initialized), so every assertion on one masks down to bit 0. The two cases
# at the bottom of this file document two further, separate gaps (`<=`/`>` unimplemented for runtime
# operands, and u1-typed comparison operands hitting a `todo!()`), and stay `ignored`.
#
# `==` doesn't get a "_left_preserved"/"_right_preserved" pair like the other operators below: its
# codegen needs one extra register to invert the underlying `NotZero` flag into `==`'s sense, which
# is just enough extra pressure to hit the same spill-reload bug documented in
# `spill_reload_regressions.toml` even with only *one* operand kept alive afterwards. So `eq_u8` and
# `eq_u16` below only check the result, not operand preservation.

[[case]]
name = "eq_u8"
source = """
global LEFT: u8;
global RIGHT: u8;

#[address = 0xC000]
global OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 10;
    RIGHT = 20;
    let left = LEFT;
    let right = RIGHT;
    OUT = left == right;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001

[[case]]
name = "ne_u8_left_preserved"
source = """
global LEFT: u8;
global RIGHT: u8;

#[address = 0xC000]
global OUT: u1;
#[address = 0xC001]
global LEFT_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 10;
    RIGHT = 20;
    let left = LEFT;
    let right = RIGHT;
    let result = left != right;
    OUT = result;
    LEFT_OUT = left;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 10

