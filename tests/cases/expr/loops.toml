[[case]]
name = "empty_loop"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
ignored = false
source = """
loop {}
"""
expected_ast = """
Loop(Loop(
  body: Block(
    statements: [],
  ),
))
"""

[[case]]
name = "loop_with_break"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
ignored = false
source = """
loop {
    break;
}
"""
expected_ast = """
Loop(Loop(
  body: Block(
    statements: [
      Break(BreakSmt()),
    ],
  ),
))
"""

[[case]]
name = "loop_with_break_value"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
ignored = false
source = """
loop {
    break 1;
}
"""
expected_ast = """
Loop(Loop(
  body: Block(
    statements: [
      Break(BreakSmt(
        value: Some(Integer((IntegerLiteral(
          value: 1,
        ), 17, 1))),
      )),
    ],
  ),
))
"""

