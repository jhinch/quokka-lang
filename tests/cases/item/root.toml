[[case]]
name = "empty_root"
kind = "parser"
entrypoint = "root"
source = """
"""
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "multiple_items"
kind = "parser"
entrypoint = "root"
source = """
const A: u8 = 1;
global B: u8;
fn main() {}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: ConstDecl(ConstDecl(
        name: ("A", (6, 1)),
        ty: TyRef(
          span: (9, 2),
          data: Simple(("u8", (9, 2))),
        ),
        value: Expr(
          span: (14, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
      )),
    ),
    Item(
      data: GlobalDecl(GlobalDecl(
        name: ("B", (24, 1)),
        ty: TyRef(
          span: (27, 2),
          data: Simple(("u8", (27, 2))),
        ),
      )),
    ),
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (34, 4)),
        ),
        body: Block(
          span: (41, 2),
          statements: [],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "invalid_item_start"
kind = "parser"
entrypoint = "root"
source = """
let x = 1;
"""
expected_errors = [
    "Syntax error: found `let` when expecting one of `fn`, `global`, `const` or `struct` @ [0:3]",
]
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "error_recovery_skips_to_next_item"
kind = "parser"
entrypoint = "root"
source = """
1 + 1
fn ok() {}
weird_token
"""
expected_errors = [
    "Syntax error: found number `1` when expecting one of `fn`, `global`, `const` or `struct` @ [0:1]",
    "Syntax error: found identifier `weird_token` when expecting one of `fn`, `global`, `const` or `struct` @ [17:28]",
]
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("ok", (9, 2)),
        ),
        body: Block(
          span: (14, 2),
          statements: [],
        ),
      )),
    ),
  ],
)
"""
