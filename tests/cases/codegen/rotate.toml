[[case]]
name = "accumulator_rotate_uses_1byte_alias"
kind = "codegen"
optimize = true
allocate_registers = true
source = """
global X: u8;
global RESULT: u8;

fn f() {
    RESULT = X <%;
}

fn main() {
    f();
}
"""
expected_lir = """
START_SECTION WRAM0
X::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0
RESULT::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
f::
.bb1:
  LD HL, X+$0000
  LD A, [HL]
  RLCA A; z, c
  LD HL, RESULT+$0000
  LD [HL], A
  RET

main::
.bb2:
  CALL f; return=.bb3

.bb3:
  RET

END_SECTION

START_SECTION ROM0[$100]
@CART_HEADER_CODE::
.bb1:
  NOP
  JP @BOOTSTRAP

END_SECTION

START_SECTION ROM0[$104]
@CART_HEADER_DATA::
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
END_SECTION

START_SECTION ROM0
@BOOTSTRAP::
.bb1:
  LD SP, $fffe
  CALL main; return=.bb2

.bb2:
  JP .bb2

END_SECTION
"""

[[case]]
name = "non_accumulator_rotate_keeps_cb_form_with_zero"
kind = "codegen"
optimize = true
allocate_registers = true
source = """
global X: u8;
global Y: u8;
global RESULT: u8;

fn f() {
    RESULT = (X <%) + (Y >%);
}

fn main() {
    f();
}
"""
expected_lir = """
START_SECTION WRAM0
X::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0
Y::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0
RESULT::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
f::
.bb1:
  LD HL, X+$0000
  LD A, [HL]
  RLCA A; z, c
  LD HL, Y+$0000
  LD B, [HL]
  RRC B; z, c
  ADD A, B; z, c
  LD HL, RESULT+$0000
  LD [HL], A
  RET

main::
.bb2:
  CALL f; return=.bb3

.bb3:
  RET

END_SECTION

START_SECTION ROM0[$100]
@CART_HEADER_CODE::
.bb1:
  NOP
  JP @BOOTSTRAP

END_SECTION

START_SECTION ROM0[$104]
@CART_HEADER_DATA::
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
data $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00, $00
END_SECTION

START_SECTION ROM0
@BOOTSTRAP::
.bb1:
  LD SP, $fffe
  CALL main; return=.bb2

.bb2:
  JP .bb2

END_SECTION
"""
