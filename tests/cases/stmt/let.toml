[[case]]
name = "if_without_block_value"
kind = "parser"
entrypoint = "statement"
preview_features = ["if-else"]
source = """
let x = if 1 then 2 else 3;
"""
expected_ast = """
Statement(
  span: (0, 27),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    value: Expr(
      span: (8, 18),
      data: If(If(
        condition: Expr(
          span: (11, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        true_block: Expr(
          span: (18, 1),
          data: Integer(IntegerLiteral(
            value: 2,
          )),
        ),
        false_block: Some(Expr(
          span: (25, 1),
          data: Integer(IntegerLiteral(
            value: 3,
          )),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "if_with_block_value"
kind = "parser"
entrypoint = "statement"
preview_features = ["if-else"]
source = """
let x = if 1 then {
    yield 2;
} else {
    yield 3;
};
"""
expected_ast = """
Statement(
  span: (0, 57),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    value: Expr(
      span: (8, 48),
      data: If(If(
        condition: Expr(
          span: (11, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        true_block: Expr(
          span: (18, 16),
          data: Block(Block(
            statements: [
              Statement(
                span: (24, 8),
                data: Yield(YieldSmt(
                  value: Expr(
                    span: (30, 1),
                    data: Integer(IntegerLiteral(
                      value: 2,
                    )),
                  ),
                )),
              ),
            ],
          )),
        ),
        false_block: Some(Expr(
          span: (40, 16),
          data: Block(Block(
            statements: [
              Statement(
                span: (46, 8),
                data: Yield(YieldSmt(
                  value: Expr(
                    span: (52, 1),
                    data: Integer(IntegerLiteral(
                      value: 3,
                    )),
                  ),
                )),
              ),
            ],
          )),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "loop_value"
kind = "parser"
entrypoint = "statement"
preview_features = ["loop"]
source = """
let x = loop {
    break 1;
};
"""
expected_ast = """
Statement(
  span: (0, 30),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    value: Expr(
      span: (8, 21),
      data: Loop(Loop(
        body: Block(
          statements: [
            Statement(
              span: (19, 8),
              data: Break(BreakSmt(
                value: Some(Expr(
                  span: (25, 1),
                  data: Integer(IntegerLiteral(
                    value: 1,
                  )),
                )),
              )),
            ),
          ],
        ),
      )),
    ),
  )),
)
"""

