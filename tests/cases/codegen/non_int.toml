[[case]]
name = "bit8_struct"
kind = "codegen"
allocate_registers = true
source = """
struct Value {
    value: u8,
}

global IN: Value;
global OUT: Value;

fn foo() {
    let v = IN;
    OUT = v;
}
fn main() {}
"""
expected_lir = """
START_SECTION WRAM0[0]
IN::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0[0]
OUT::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
foo::
.bb1:
  LD HL, IN+$0000
  LD A, [HL]
  LD HL, OUT+$0000
  LD [HL], A
  RET

END_SECTION

START_SECTION ROM0[256]
main::
.bb1:
  RET

END_SECTION
"""

