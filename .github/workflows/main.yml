name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --all --verbose
    - name: Test
      run: cargo test --all --locked --verbose
    - name: Clippy
      run: cargo clippy --all --verbose
    - name: Check format
      run: cargo fmt --all --check -- --verbose
