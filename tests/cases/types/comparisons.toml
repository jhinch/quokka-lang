[[case]]
name = "relational_ops_yield_bool"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let b: u1 = x < y;
}
"""
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    y#2: u8 = copy 2
    b#3: u1 = lt x#1, y#2
    return
"""

[[case]]
name = "relational_ops_mismatched_operands"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = 1;
    let b: u1 = x < y;
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [70:71]",
]

