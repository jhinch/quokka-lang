[[case]]
name = "builtin_const"
kind = "parser"
source = """
const A: u8 = 1;
"""
expected_ast = """
Root(
  items: [
    Item(
      data: ConstDecl(ConstDecl(
        name: Spanned(
          data: "A",
          span: SourceSpan(
            offset: SourceOffset(6),
            length: 1,
          ),
        ),
        ty: TyRef(
          name: Spanned(
            data: "u8",
            span: SourceSpan(
              offset: SourceOffset(9),
              length: 2,
            ),
          ),
        ),
        value: Expr(
          span: SourceSpan(
            offset: SourceOffset(14),
            length: 1,
          ),
          data: Integer(Spanned(
            data: IntegerLiteral(
              value: 1,
            ),
            span: SourceSpan(
              offset: SourceOffset(14),
              length: 1,
            ),
          )),
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "const_with_expression_value"
kind = "parser"
entrypoint = "item"
source = """
const A: u8 = 1 + 2;
"""
expected_ast = """
Item(
  data: ConstDecl(ConstDecl(
    name: Spanned(
      data: "A",
      span: SourceSpan(
        offset: SourceOffset(6),
        length: 1,
      ),
    ),
    ty: TyRef(
      name: Spanned(
        data: "u8",
        span: SourceSpan(
          offset: SourceOffset(9),
          length: 2,
        ),
      ),
    ),
    value: Expr(
      span: SourceSpan(
        offset: SourceOffset(14),
        length: 5,
      ),
      data: Binary(BinaryOp(
        kind: Add,
        left: Expr(
          span: SourceSpan(
            offset: SourceOffset(14),
            length: 1,
          ),
          data: Integer(Spanned(
            data: IntegerLiteral(
              value: 1,
            ),
            span: SourceSpan(
              offset: SourceOffset(14),
              length: 1,
            ),
          )),
        ),
        right: Expr(
          span: SourceSpan(
            offset: SourceOffset(18),
            length: 1,
          ),
          data: Integer(Spanned(
            data: IntegerLiteral(
              value: 2,
            ),
            span: SourceSpan(
              offset: SourceOffset(18),
              length: 1,
            ),
          )),
        ),
      )),
    ),
  )),
)
"""

