[[case]]
name = "bare_path"
kind = "parser"
entrypoint = "expr"
source = """
a
"""
expected_ast = """
Expr(
  span: (0, 1),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 1),
  )),
)
"""

[[case]]
name = "single_field_access"
kind = "parser"
entrypoint = "expr"
source = """
a.b
"""
expected_ast = """
Expr(
  span: (0, 3),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 3),
    projections: [
      Field(("b", (2, 1))),
    ],
  )),
)
"""

[[case]]
name = "chained_field_access"
kind = "parser"
entrypoint = "expr"
source = """
a.b.c
"""
expected_ast = """
Expr(
  span: (0, 5),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 5),
    projections: [
      Field(("b", (2, 1))),
      Field(("c", (4, 1))),
    ],
  )),
)
"""

[[case]]
name = "field_access_within_arithmetic"
kind = "parser"
entrypoint = "expr"
source = """
a.b + c.d
"""
expected_ast = """
Expr(
  span: (0, 9),
  data: Arithmetic(ArithmeticOp(
    kind: Add,
    left: Expr(
      span: (0, 3),
      data: Place(Place(
        name: ("a", (0, 1)),
        span: (0, 3),
        projections: [
          Field(("b", (2, 1))),
        ],
      )),
    ),
    right: Expr(
      span: (6, 3),
      data: Place(Place(
        name: ("c", (6, 1)),
        span: (6, 3),
        projections: [
          Field(("d", (8, 1))),
        ],
      )),
    ),
  )),
)
"""

[[case]]
name = "assign_to_field"
kind = "parser"
entrypoint = "expr"
source = """
a.b = 1
"""
expected_ast = """
Expr(
  span: (0, 7),
  data: Assign(AssignOp(
    kind: Assign,
    left: Place(
      name: ("a", (0, 1)),
      span: (0, 3),
      projections: [
        Field(("b", (2, 1))),
      ],
    ),
    right: Expr(
      span: (6, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "array_index"
kind = "parser"
entrypoint = "expr"
source = """
a[0]
"""
expected_ast = """
Expr(
  span: (0, 4),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 4),
    projections: [
      Index(Expr(
        span: (2, 1),
        data: Integer(IntegerLiteral(
          value: 0,
        )),
      )),
    ],
  )),
)
"""

[[case]]
name = "field_then_index"
kind = "parser"
entrypoint = "expr"
source = """
a.b[0]
"""
expected_ast = """
Expr(
  span: (0, 6),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 6),
    projections: [
      Field(("b", (2, 1))),
      Index(Expr(
        span: (4, 1),
        data: Integer(IntegerLiteral(
          value: 0,
        )),
      )),
    ],
  )),
)
"""

[[case]]
name = "index_then_field"
kind = "parser"
entrypoint = "expr"
source = """
a[0].b
"""
expected_ast = """
Expr(
  span: (0, 6),
  data: Place(Place(
    name: ("a", (0, 1)),
    span: (0, 6),
    projections: [
      Index(Expr(
        span: (2, 1),
        data: Integer(IntegerLiteral(
          value: 0,
        )),
      )),
      Field(("b", (5, 1))),
    ],
  )),
)
"""

[[case]]
name = "index_on_literal_value"
kind = "parser"
entrypoint = "expr"
source = """
1[0]
"""
expected_errors = [
    "Syntax error: array index requires array @ [1:4]",
]

[[case]]
name = "index_on_grouped_value"
kind = "parser"
entrypoint = "expr"
source = """
(1 + 2)[0]
"""
expected_errors = [
    "Syntax error: array index requires array @ [7:10]",
]

[[case]]
name = "index_on_call_result"
kind = "parser"
entrypoint = "expr"
source = """
a()[0]
"""
expected_errors = [
    "Syntax error: array index requires array @ [3:6]",
]

[[case]]
name = "field_access_on_literal_value"
kind = "parser"
entrypoint = "expr"
source = """
1.b
"""
expected_errors = [
    "Syntax error: field access requires struct @ [1:3]",
]

[[case]]
name = "field_access_on_grouped_value"
kind = "parser"
entrypoint = "expr"
source = """
(1 + 2).b
"""
expected_errors = [
    "Syntax error: field access requires struct @ [7:9]",
]

[[case]]
name = "field_access_on_call_result"
kind = "parser"
entrypoint = "expr"
source = """
a().b
"""
expected_errors = [
    "Syntax error: field access requires struct @ [3:5]",
]
