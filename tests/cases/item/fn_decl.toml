[[case]]
name = "empty_fn"
kind = "parser"
source = """
fn main() {}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (3, 4)),
        ),
        body: Block(
          span: (10, 2),
          statements: [],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "missing_closing_brace"
kind = "parser"
source = """
fn main() {
"""
expected_errors = [
    "Syntax error: found end of file when expecting `}` @ [12:12]",
]
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "expression_without_body"
kind = "parser"
source = """
fn main() 1 + 2
"""
expected_errors = [
    "Syntax error: found number `1` when expecting `{` @ [10:11]",
]
expected_ast = """
Root(
  items: [],
)
"""

[[case]]
name = "fn_with_return"
kind = "parser"
source = """
fn that_function() -> u8 {
    return 1;
}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("that_function", (3, 13)),
          ty: Some(TyRef(
            span: (22, 2),
            data: Simple(("u8", (22, 2))),
          )),
        ),
        body: Block(
          span: (25, 17),
          statements: [
            Statement(
              span: (31, 9),
              data: Return(ReturnSmt(
                value: Some(Expr(
                  span: (38, 1),
                  data: Integer(IntegerLiteral(
                    value: 1,
                  )),
                )),
              )),
            ),
          ],
        ),
      )),
    ),
  ],
)
"""

