[[case]]
name = "accumulator_rotate_uses_1byte_alias"
kind = "codegen"
optimize = true
allocate_registers = true
source = """
global X: u8;
global RESULT: u8;

fn f() {
    RESULT = X <%;
}

fn main() {
    f();
}
"""
expected_lir = """
START_SECTION WRAM0
X::
alloc 8 x bit
END_SECTION

START_SECTION WRAM0
RESULT::
alloc 8 x bit
END_SECTION

START_SECTION ROM0
f::
.bb1:
  LD HL, X+$0000
  LD A, [HL]
  RLCA A; z, c
  LD HL, RESULT+$0000
  LD [HL], A
  RET

main::
.bb2:
  CALL f; return=.bb3

.bb3:
  RET

END_SECTION

START_SECTION ROM0[$00]
_@RST_00::
.bb1:
  RET

END_SECTION

