expected_mir = """
@GlobalDeclAttributes { region: Auto, address: None }
global DATA: [u8; 8]
@GlobalDeclAttributes { region: Auto, address: None }
global SWAP_COUNT: u8

bubble_sort -> u8:
  .bb1:
    swaps#2: u8 = copy 0
    i#3: u16 = copy 0
    jump .bb2
  .bb2:
    i#4: u16 = phi i#3 <- .bb1, i#38 <- .bb9
    #5: u16 = copy 8
    #6: u1 = ge i#4, #5
    swaps#33: u8 = phi swaps#2 <- .bb1, swaps#27 <- .bb9
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    #7: u16 = copy 8
    #8: u16 = sub #7, i#4
    #9: u16 = copy 1
    limit#10: u16 = sub #8, #9
    j#11: u16 = copy 0
    jump .bb8
  .bb3:
    #RET: u8 = copy swaps#33
    return
  .bb8:
    j#12: u16 = phi j#11 <- .bb5, j#31 <- .bb15
    limit#13: u16 = copy limit#10
    #14: u1 = ge j#12, limit#13
    swaps#27: u8 = phi swaps#33 <- .bb5, swaps#34 <- .bb15
    i#36: u16 = copy i#4
    jumpif #14 != 0, .bb10, .bb11
  .bb10:
    jump .bb9
  .bb11:
    #15: u16 = copy 1
    #16: u16 = add j#12, #15
    #17: u8 = load DATA[#16]
    #18: u8 = load DATA[j#12]
    #19: u1 = lt #17, #18
    jumpif #19 != 0, .bb14, .bb15
  .bb9:
    #35: u16 = copy 1
    i#38: u16 = add i#4, #35
    jump .bb2
  .bb14:
