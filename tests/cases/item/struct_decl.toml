[[case]]
name = "empty_struct"
kind = "parser"
entrypoint = "item"
source = """
struct Name {}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("Name", (7, 4)),
    fields: [],
  )),
)
"""

[[case]]
name = "multiple_fields"
kind = "parser"
entrypoint = "item"
source = """
struct Point {
    x: u8,
    y: u8,
}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("Point", (7, 5)),
    fields: [
      FieldDecl(
        name: ("x", (19, 1)),
        ty: TyRef(
          span: (22, 2),
          data: Simple(("u8", (22, 2))),
        ),
      ),
      FieldDecl(
        name: ("y", (30, 1)),
        ty: TyRef(
          span: (33, 2),
          data: Simple(("u8", (33, 2))),
        ),
      ),
    ],
  )),
)
"""

[[case]]
name = "multiple_fields_no_trailing_comma"
kind = "parser"
entrypoint = "item"
source = """
struct Point {
    x: u8,
    y: u8
}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("Point", (7, 5)),
    fields: [
      FieldDecl(
        name: ("x", (19, 1)),
        ty: TyRef(
          span: (22, 2),
          data: Simple(("u8", (22, 2))),
        ),
      ),
      FieldDecl(
        name: ("y", (30, 1)),
        ty: TyRef(
          span: (33, 2),
          data: Simple(("u8", (33, 2))),
        ),
      ),
    ],
  )),
)
"""

[[case]]
name = "missing_comma_between_fields"
kind = "parser"
entrypoint = "item"
source = """
struct Point {
    x: u8
    y: u8
}
"""
expected_errors = [
    "Syntax error: found <ident> when expecting , @ [29:30]",
]

[[case]]
name = "single_field"
kind = "parser"
source = """
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: StructDecl(StructDecl(
        name: ("Name", (7, 4)),
        fields: [
          FieldDecl(
            name: ("field", (18, 5)),
            ty: TyRef(
              span: (25, 2),
              data: Simple(("u8", (25, 2))),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""

[[case]]
name = "padding_field"
kind = "analyzer"
source = """
struct Name {
    one: u8,
    _: u8,
    two: u8,
}

fn main() {}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "multiple_padding_fields"
kind = "analyzer"
source = """
struct Name {
    one: u8,
    _: u8,
    _: u8,
    two: u8,
}

fn main() {}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "signed_int_padding_fields"
kind = "analyzer"
source = """
struct Name {
    one: u8,
    _: i8,
    two: u8,
}

fn main() {}
"""
expected_errors = [
    "padding field type `i8` not an unsigned int @ [31:36]",
]

[[case]]
name = "struct_padding_fields"
kind = "analyzer"
source = """
struct Foo {
    one: u8,
}
struct Bar {
    one: u8,
    _: Foo,
    two: u8,
}

fn main() {}
"""
expected_errors = [
    "padding field type `Foo` not an unsigned int @ [58:64]",
]

[[case]]
name = "struct_with_attribute"
kind = "parser"
source = """
#[this_attribute]
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 17),
          name: ("this_attribute", (2, 14)),
        ),
      ],
      data: StructDecl(StructDecl(
        name: ("Name", (25, 4)),
        fields: [
          FieldDecl(
            name: ("field", (36, 5)),
            ty: TyRef(
              span: (43, 2),
              data: Simple(("u8", (43, 2))),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""


[[case]]
name = "struct_multiple_attributes"
kind = "parser"
source = """
#[this_attribute]
#[that_attribute]
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 17),
          name: ("this_attribute", (2, 14)),
        ),
        AttributeDecl(
          span: (18, 17),
          name: ("that_attribute", (20, 14)),
        ),
      ],
      data: StructDecl(StructDecl(
        name: ("Name", (43, 4)),
        fields: [
          FieldDecl(
            name: ("field", (54, 5)),
            ty: TyRef(
              span: (61, 2),
              data: Simple(("u8", (61, 2))),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""

