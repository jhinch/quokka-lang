[[case]]
name = "fn_with_attribute"
kind = "parser"
source = """
#[entrypoint]
fn main() -> never {
    loop {}
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 13),
          name: ("entrypoint", (2, 10)),
        ),
      ],
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (17, 4)),
          ty: Some(TyRef(
            span: (27, 5),
            data: Simple(("never", (27, 5))),
          )),
        ),
        body: Block(
          span: (33, 15),
          statements: [
            Statement(
              span: (39, 7),
              data: Expr(ExprSmt(
                value: Expr(
                  span: (39, 7),
                  data: Loop(Loop(
                    body: Block(
                      span: (44, 2),
                      statements: [],
                    ),
                  )),
                ),
              )),
            ),
          ],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "fn_with_multiple_attributes"
kind = "parser"
source = """
#[inline = never]
#[entrypoint]
fn main() -> never {
    loop {}
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          span: (0, 17),
          name: ("inline", (2, 6)),
          value: Some(AttributeValue(
            span: (11, 5),
            data: Ident("never"),
          )),
        ),
        AttributeDecl(
          span: (18, 13),
          name: ("entrypoint", (20, 10)),
        ),
      ],
      data: FnDecl(FnDecl(
        signature: FnSig(
          name: ("main", (35, 4)),
          ty: Some(TyRef(
            span: (45, 5),
            data: Simple(("never", (45, 5))),
          )),
        ),
        body: Block(
          span: (51, 15),
          statements: [
            Statement(
              span: (57, 7),
              data: Expr(ExprSmt(
                value: Expr(
                  span: (57, 7),
                  data: Loop(Loop(
                    body: Block(
                      span: (62, 2),
                      statements: [],
                    ),
                  )),
                ),
              )),
            ),
          ],
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "fn_with_top_level_yield"
kind = "analyzer"
source = """
fn get_one() -> u8 {
    yield 1;
}

fn main() {
    get_one();
}
"""
expected_errors = [
    "`yield` outside of a block @ [25:33]",
]

