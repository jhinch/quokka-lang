# Tests for bit cast expressions (`expr as Type`).

[[case]]
name = "bit_cast_simple"
kind = "parser"
entrypoint = "expr"
source = """
a as u16
"""
expected_ast = """
Expr(
  span: (0, 8),
  data: BitCast(BitCast(
    expr: Expr(
      span: (0, 1),
      data: Place(Place(
        name: ("a", (0, 1)),
        span: (0, 1),
      )),
    ),
    ty: TyRef(
      span: (5, 3),
      data: Simple(("u16", (5, 3))),
    ),
  )),
)
"""

