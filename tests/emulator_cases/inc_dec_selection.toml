#[address = 0x0150]
fn checkpoint() {}

fn main() {
    START = 0xFF01 as u16;
    let pointer = START;
    let steps = 0 as u16;
    loop {
        if pointer == 0xFDFE then {
            break;
        }
        pointer = pointer - 1;
        steps = steps + 1;
    }
    OUT = pointer;
    STEPS = steps;

    checkpoint();
}
"""
