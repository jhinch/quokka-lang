[[case]]
name = "loop_break_via_if_no_else"
kind = "analyzer"
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    loop {
        if i == n then {
            break;
        }
        i += 1;
    }
    return i;
}

fn main() {}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    i#3: u8 = copy 0
    jump .bb2
  .bb2:
    i#4: u8 = phi i#3 <- .bb1, i#8 <- .bb5
    n#5: u8 = copy n#2
    #6: u1 = eq i#4, n#5
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    #7: u8 = copy 1
    i#8: u8 = add i#4, #7
    jump .bb2
  .bb3:
    #RET: u8 = copy i#4
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

