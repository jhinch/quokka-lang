    jumpif #11 != 0, .bb4, .bb5
  .bb4:
    r#12: u8 = copy 7
    jump .bb5
  .bb5:
    r#13: u8 = phi r#14 <- .bb1, r#12 <- .bb4
    #RET: u8 = copy r#13
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""

[[case]]
name = "if_canonicalized_to_constant_false_keeps_the_variable_read_after_it"
kind = "analyzer"
optimize = true
preview_features = ["canonicalize"]
source = """
global A: u8;
global OUT: u8;

fn main() {
    let a = A;
    let r = a;
    if a < 0 then {
        r = a + 2;
    }
    OUT = r;
    loop {}
}
"""
expected_mir = """
global A: u8
global OUT: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u8 = load A
    r#2: u8 = copy a#1
    r#7: u8 = copy r#2
    store OUT = r#7
    jump .bb4
  .bb4:
    jump .bb4
"""
