[[case]]
name = "bare_literal"
kind = "parser"
entrypoint = "statement"
source = """
1;
"""
expected_ast = """
Statement(
  span: (0, 2),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "bare_place"
kind = "parser"
entrypoint = "statement"
source = """
x;
"""
expected_ast = """
Statement(
  span: (0, 2),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 1),
      data: Place(Place(
        name: ("x", (0, 1)),
        span: (0, 1),
      )),
    ),
  )),
)
"""

[[case]]
name = "binary_op"
kind = "parser"
entrypoint = "statement"
source = """
1 + 2;
"""
expected_ast = """
Statement(
  span: (0, 6),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 5),
      data: Arithmetic(ArithmeticOp(
        kind: Add,
        left: Expr(
          span: (0, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        right: Expr(
          span: (4, 1),
          data: Integer(IntegerLiteral(
            value: 2,
          )),
        ),
      )),
    ),
  )),
)
"""

[[case]]
name = "grouped"
kind = "parser"
entrypoint = "statement"
source = """
(1 + 2);
"""
expected_ast = """
Statement(
  span: (0, 8),
  data: Expr(ExprSmt(
    value: Expr(
      span: (0, 7),
      data: Paren(Expr(
        span: (1, 5),
        data: Arithmetic(ArithmeticOp(
          kind: Add,
          left: Expr(
            span: (1, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (5, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      )),
    ),
  )),
)
"""

[[case]]
name = "assignment"
kind = "parser"
entrypoint = "statement"
source = """
x = 1;
"""
