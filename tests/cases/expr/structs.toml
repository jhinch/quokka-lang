[[case]]
name = "struct_expr_in_comparison"
kind = "parser"
entrypoint = "expr"
source = """
Foo { a: 1 } == Foo { a: 2 }
"""
expected_ast = """
Expr(
  span: (0, 28),
  data: Comparison(ComparisonOp(
    kind: Eq,
    left: Expr(
      span: (0, 12),
      data: Struct(StructExpr(
        name: ("Foo", (0, 3)),
        fields: [
          StructExprField(
            name: ("a", (6, 1)),
            value: Expr(
              span: (9, 1),
              data: Integer(IntegerLiteral(
                value: 1,
              )),
            ),
          ),
        ],
      )),
    ),
    right: Expr(
      span: (16, 12),
      data: Struct(StructExpr(
        name: ("Foo", (16, 3)),
        fields: [
          StructExprField(
            name: ("a", (22, 1)),
            value: Expr(
              span: (25, 1),
              data: Integer(IntegerLiteral(
                value: 2,
              )),
            ),
          ),
        ],
      )),
    ),
  )),
)
"""

