[[case]]
name = "missing_closing_bracket"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute
fn main() {}
"""
expected_errors = [
    "Syntax error: found Fn when expecting [RightBracket] @ [17:19]",
]

[[case]]
name = "missing_attribute_name"
