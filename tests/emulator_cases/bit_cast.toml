[[case]]
name = "u8_to_i8_preserves_bit_pattern"
source = """
global A: i8;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = -1;
    let v = A;
    OUT = v as u8;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0xFF

