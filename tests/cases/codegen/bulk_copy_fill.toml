START_SECTION WRAM0
A::
alloc 32 x bit
END_SECTION

START_SECTION WRAM0
B::
alloc 32 x bit
END_SECTION

START_SECTION ROM0
main::
.bb1:
  LD HL, A+$0000
  (high_out=H;low_out=L;in=HL)
  LD r8#3, L
  LD r8#4, H
  (out=r16#2;high_in=r8#4;low_in=r8#3)
  LD HL, B+$0000
  LD r16#4, $0004
  BULKCOPY! r16#2, HL, r16#4, A; z, c
