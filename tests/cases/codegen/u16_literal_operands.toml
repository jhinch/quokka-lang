# The Game Boy has no 16-bit ALU immediates, so u16 binary operators lower to a pair of byte ops.
# When the right operand is a literal, each byte op should use its `n8` immediate form
# (`ADD`/`ADC`/`SUB`/`SBC`/`AND`/`OR`/`XOR A,n8`) rather than first loading the literal's bytes into
# registers with `LD r8,n8`.

[[case]]
name = "add_u16_literal_uses_immediates"
kind = "codegen"
optimize = true
allocate_registers = true
source = """
global X: u16;
global RESULT: u16;

fn main() {
    RESULT = X + 0x12FF;
}
"""
expected_lir = """
START_SECTION WRAM0
X::
alloc 16 x bit
END_SECTION

START_SECTION WRAM0
RESULT::
alloc 16 x bit
END_SECTION

START_SECTION ROM0
main::
.bb1:
  LD HL, X+$0000
  LD A, [HL++]
  LD B, [HL]
  ADD A, $ff; z, c
  LD C, A
  LD A, B
  ADC A, $12; z, c
  LD B, A
  LD HL, RESULT+$0000
  LD A, C
  LD [HL++], A
  LD [HL], B
  RET

END_SECTION

