[[case]]
name = "builtin_global"
kind = "parser"
source = """
global A: u8;
"""
expected_ast = """
Root(
  items: [
    Item(
      data: GlobalDecl(GlobalDecl(
        name: ("A", (7, 1)),
        ty: TyRef(
          span: (10, 2),
          name: ("u8", (10, 2)),
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "global_with_attribute"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
global A: u8;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: GlobalDecl(GlobalDecl(
    name: ("A", (25, 1)),
    ty: TyRef(
      span: (28, 2),
      name: ("u8", (28, 2)),
    ),
  )),
)
"""

[[case]]
name = "missing_type"
kind = "parser"
entrypoint = "item"
source = """
global A;
"""
expected_errors = [
    "Syntax error: found Semicolon when expecting [Colon] @ [8:9]",
]

[[case]]
name = "missing_semicolon"
kind = "parser"
entrypoint = "item"
source = """
global A: u8
"""
expected_errors = [
    "Syntax error: found Eof when expecting [Semicolon] @ [13:13]",
]

[[case]]
name = "global_with_analysis"
kind = "analyzer"
source = """
global A: u8;
fn main() {}
"""

[[case]]
name = "global_and_fn_name_collision"
kind = "analyzer"
source = """
fn A() {}
global A: u8;
fn main() {}
"""
expected_errors = [
    "name `A` defined multiple times in scope @ [17:18]",
]

[[case]]
name = "redefined_const_as_global"
kind = "analyzer"
source = """
const A: u8 = 1;
global A: u8;
fn main() {}
"""
expected_errors = [
    "name `A` defined multiple times in scope @ [24:25]",
]

[[case]]
name = "global_undefined_type"
kind = "analyzer"
source = """
global A: NotAType;
fn main() {}
"""
expected_errors = [
    "cannot find type `NotAType` @ [10:18]",
]
