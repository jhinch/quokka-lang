[[case]]
name = "if_branches_mismatched_types"
kind = "analyzer"
source = """
fn main() {
    let c: u1 = 1;
    let a: u8 = 1;
    let b: u1 = 1;
    let r = if c then { yield a; } else { yield b; };
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [109:121]",
]

[[case]]
name = "if_branches_matching_types_ok"
kind = "analyzer"
source = """
fn main() {
    let c: u1 = 1;
    let a: u8 = 1;
    let b: u8 = 2;
    let r: u8 = if c then { yield a; } else { yield b; };
}
"""
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    c#1: u1 = copy 1
    a#2: u8 = copy 1
    b#3: u8 = copy 2
    jumpif c#1 != 0, .bb2, .bb3
  .bb2:
    jump .bb4
  .bb3:
    jump .bb4
  .bb4:
    r#4: u8 = phi a#2 <- .bb2, b#3 <- .bb3
    return
"""

[[case]]
name = "if_no_else_but_used_as_value"
