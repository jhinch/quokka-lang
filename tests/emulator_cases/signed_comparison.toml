[[case]]
name = "i8_lt_negative_operand_less_than_positive"
source = """
global A: i8;
global B: i8;

#[address = 0xC000]
global OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = -1;
    B = 1;
    OUT = A < B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001

