name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install RGBDS
      run: ./.github/actions/install-rgbds.sh
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Test
      run: cargo test --workspace --locked --verbose
    - name: Clippy
      run: cargo clippy --workspace --locked --verbose
    - name: Check format
      run: cargo fmt --all --check -- --verbose
    - name: Check rustdoc
      run:  cargo doc --workspace --locked --no-deps --verbose
    - name: Test (Release)
      run: cargo test --workspace --locked --release --verbose
