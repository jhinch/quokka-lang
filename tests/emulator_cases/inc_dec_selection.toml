[[case]]
name = "u16_steps_up_through_oam_range"
source = """
global START: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global STEPS: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    START = 0xFDFE as u16;
    let pointer = START;
    let steps = 0 as u16;
    loop {
        if pointer == 0xFF01 then {
            break;
        }
        pointer = pointer + 1;
        steps = steps + 1;
    }
    OUT = pointer;
    STEPS = steps;

    checkpoint();
}
"""
await_pc = 0x0150
max_instructions = 20_000
[[case.assertion]]
addr = 0xC000
expected = [0x01, 0xFF] # 0xFF01
[[case.assertion]]
addr = 0xC002
expected = [0x03, 0x01] # 0x0103

