[[case]]
name = "infinite_loop_as_fn_body_satisfies_non_unit_return_ty"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn foo() -> u8 {
    loop {
    }
}
"""
expected_mir = """
foo -> u8:
  .bb1:
    jump .bb2
  .bb2:
    jump .bb2
"""

[[case]]
name = "code_after_infinite_loop_statement_is_unreachable"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    loop {
    }
    let x: u8 = 1;
}
"""
expected_errors = [
    "unreachable code @ [33:47]",
]

[[case]]
name = "loop_with_break_value_used_by_let"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let x: u8 = 1;
    let r: u8 = loop {
        break x;
    };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    jump .bb2
  .bb2:
    x#2: <unresolved> = copy x#1
    jump .bb3
  .bb3:
    r#3: u8 = copy x#2
    return
"""

[[case]]
name = "loop_break_type_mismatch_across_multiple_breaks"
kind = "analyzer"
preview_features = ["loop", "if-else"]
source = """
fn main() {
    let x: u8 = 1;
    let c: u1 = 1;
    let d = loop {
        if c then {
            break c;
        }
        break x;
    };
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [62:142]",
]

[[case]]
name = "nested_loop_break_targets_innermost_loop"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let r = loop {
        let d = loop {
            break y;
        };
        break x;
    };
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: <unresolved> = copy 1
    y#2: <unresolved> = copy 2
    jump .bb2
  .bb2:
    y#4: <unresolved> = copy y#2
    x#6: <unresolved> = copy x#1
    jump .bb4
  .bb4:
    y#3: <unresolved> = copy y#4
    jump .bb5
  .bb5:
    d#5: <unresolved> = copy y#3
    jump .bb3
  .bb3:
    r#7: <unresolved> = copy x#6
    return
"""

[[case]]
name = "loop_without_break_used_as_value_is_never"
kind = "analyzer"
preview_features = ["loop"]
source = """
fn main() {
    let r: u8 = loop {
    };
}
"""
expected_errors = [
    "`u8` is not equal to `never` @ [28:40]",
]
