[[case]]
name = "call_ok"
kind = "analyzer"
preview_features = ["function-call"]
ignored = false
source = """
fn helper() {}
fn main() {
    helper();
}
"""

[[case]]
name = "call_undefined_fn"
kind = "analyzer"
preview_features = ["function-call"]
ignored = false
source = """
fn main() {
    helper();
}
"""
expected_errors = [
    "name `helper` not defined in scope @ [16:22]",
]

[[case]]
name = "call_non_function"
kind = "analyzer"
preview_features = ["function-call"]
ignored = false
source = """
global A: u8;
fn main() {
    A();
}
"""
expected_errors = [
    "`u8` is not a function type @ [30:33]",
]

[[case]]
name = "call_return_type_used_by_let"
kind = "analyzer"
preview_features = ["function-call"]
ignored = false
source = """
fn helper() -> u8 {
    return 1;
}
fn main() {
    let x: u8 = helper();
}
"""

[[case]]
name = "call_return_type_mismatch"
kind = "analyzer"
preview_features = ["function-call"]
ignored = false
source = """
fn helper() -> u8 {
    return 1;
}
fn main() {
    let x: u1 = helper();
}
"""
expected_errors = [
    "`u1` is not equal to `u8` @ [64:72]",
]
