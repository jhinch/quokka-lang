[[case]]
name = "add_u8_one_keeps_earlier_less_than"
source = """
global LEFT: u8;
global RIGHT: u8;
global VALUE: u8;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 0x01;
    RIGHT = 0x02;
    VALUE = 0xFF;
    let left = LEFT;
    let right = RIGHT;
    let value = VALUE;
    let condition = left < right;
    let stepped = value + 1;
    if condition then {
        OUT = stepped;
    } else {
        OUT = 0x55;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x00

