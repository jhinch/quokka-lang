    ), 20, 1))),
  )),
  true_block: Integer((IntegerLiteral(
    value: 4,
  ), 27, 1)),
  false_block: Some(Integer((IntegerLiteral(
    value: 5,
  ), 34, 1))),
))
"""

[[case]]
name = "mixed_block_and_without_block_branches"
kind = "parser"
entrypoint = "expr"
preview_features = ["if-else"]
ignored = false
source = """
if 1 then 2 else { yield 3; }
"""
expected_ast = """
If(If(
  condition: Integer((IntegerLiteral(
    value: 1,
  ), 3, 1)),
  true_block: Integer((IntegerLiteral(
    value: 2,
  ), 10, 1)),
  false_block: Some(Block(Block(
    statements: [
