[[case]]
name = "call_returns_u1_value"
source = """
#[address = 0xC000]
global OUT: u1;

fn get_value() -> u1 {
    return 1;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    let v = get_value();
    OUT = v;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001

