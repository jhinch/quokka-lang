global IN_A: u8;
global IN_B: u8;
global IN_C: u8;
global IN_D: u8;
global IN_E: u8;
global OUT: [u8; 5];

fn main() {
    let a = IN_A + 10;
    let b = IN_B + 20;
    let c = IN_C + 30;
    let d = IN_D + 40;
    let e = IN_E + 50;
    breakpoint;
    OUT[0] = a;
    OUT[1] = b;
    OUT[2] = c;
    OUT[3] = d;
    OUT[4] = e;
}
"""
