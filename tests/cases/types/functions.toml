[[case]]
name = "call_ok"
kind = "analyzer"
source = """
fn helper() {}
fn main() {
    helper();
}
"""
expected_mir = """
helper -> unit:
  .bb1:
    return

@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    call helper, .bb2
  .bb2:
    return
"""

[[case]]
name = "call_undefined_fn"
kind = "analyzer"
source = """
fn main() {
    helper();
}
"""
expected_errors = [
    "name `helper` not defined in scope @ [16:22]",
]

[[case]]
name = "call_non_function"
kind = "analyzer"
source = """
global A: u8;
fn main() {
    A();
}
"""
expected_errors = [
    "`u8` is not a function type @ [30:33]",
]

[[case]]
name = "call_return_type_used_by_let"
kind = "analyzer"
source = """
fn helper() -> u8 {
    return 1;
}
fn main() {
    let x: u8 = helper();
}
"""
expected_mir = """
helper -> u8:
  .bb1:
    #2: u8 = copy 1
    #RET: u8 = copy #2
    return

@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    call helper, .bb2
  .bb2:
    x#1: u8 = returnvalue
    return
"""

[[case]]
name = "call_return_type_mismatch"
kind = "analyzer"
source = """
fn helper() -> u8 {
    return 1;
}
fn main() {
    let x: u1 = helper();
}
"""
expected_errors = [
    "`u1` is not equal to `u8` @ [64:72]",
]

[[case]]
name = "return_struct"
kind = "analyzer"
source = """
struct Point {
    x: u16,
}
global A: Point;
fn get_a() -> Point {
    return A;
}
fn main() {}
"""
expected_mir = """
@GlobalDeclAttributes { region: Auto, address: None }
global A: Point

get_a -> Point:
  .bb1:
    #2: Point = load A
    #RET: Point = copy #2
    return

@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "return_oversized_struct"
kind = "analyzer"
source = """
struct Point {
    x: u16,
    y: u16,
}
global A: Point;
fn get_a() -> Point {
    return A;
}
fn main() {}
"""
expected_errors = [
    "type `Point` too large to fit in a local variable. 32 bits > 16 bits @ [84:93]",
]
