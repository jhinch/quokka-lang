[[case]]
name = "assign_to_local_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    x = 2;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    x#2: u8 = copy 2
    return
"""

[[case]]
name = "assign_to_global_ok"
kind = "analyzer"
source = """
global x: u8;
fn main() {
    x = 2;
}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global x: u8

main -> unit:
  .bb1:
    #1: u8 = copy 2
    store x = #1
    return
"""

[[case]]
name = "assign_struct_global_to_global"
kind = "analyzer"
source = """
struct Point {
    x: u8,
}
global A: Point;
global B: Point;
fn main() {
    A = B;
}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global A: Point
@GlobalDeclAttributes { section: Auto }
global B: Point

main -> unit:
  .bb1:
    #1: Point = load B
    store A = #1
    return
"""

[[case]]
name = "assign_oversized_struct_global_to_global"
kind = "analyzer"
source = """
struct Point {
    x: u16,
    y: u16,
}
global A: Point;
global B: Point;
fn main() {
    A = B;
}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global A: Point
@GlobalDeclAttributes { section: Auto }
global B: Point

main -> unit:
  .bb1:
    #1: Point = load B
    store A = #1
    return
"""

[[case]]
name = "assign_struct_global_to_local"
kind = "analyzer"
source = """
struct Point {
    x: u16,
}
global A: Point;
fn main() {
    let b = A;
}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global A: Point

main -> unit:
  .bb1:
    b#1: Point = load A
    return
"""

[[case]]
name = "assign_oversized_struct_global_to_local"
kind = "analyzer"
source = """
struct Point {
    x: u16,
    y: u16,
}
global A: Point;
fn main() {
    let b = A;
}
"""
expected_errors = [
    "type `Point` too large to fit in a local variable. 32 bits > 16 bits @ [74:84]",
]

[[case]]
name = "compound_assign_add_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    x += 1;
}
"""
expected_mir = """
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    #2: u8 = copy 1
    x#3: u8 = add x#1, #2
    return
"""

[[case]]
name = "compound_assign_add_global_ok"
kind = "analyzer"
source = """
global x: u8;
fn main() {
    x += 1;
}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global x: u8

main -> unit:
  .bb1:
    #1: u8 = copy 1
    #2: u8 = load x
    #3: u8 = add #2, #1
    store x = #3
    return
"""

[[case]]
name = "compound_assign_type_mismatch"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = 1;
    x += y;
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [59:60]",
]
