[[case]]
name = "empty_loop"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
source = """
loop {}
"""
expected_ast = """
Expr(
  span: (0, 7),
  data: Loop(Loop(
    body: Block(
      span: (5, 2),
      statements: [],
    ),
  )),
)
"""

[[case]]
name = "loop_with_break"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
source = """
loop {
    break;
}
"""
expected_ast = """
Expr(
  span: (0, 19),
  data: Loop(Loop(
    body: Block(
      span: (5, 14),
      statements: [
        Statement(
          span: (11, 6),
          data: Break(BreakSmt()),
        ),
      ],
    ),
  )),
)
"""

[[case]]
name = "loop_with_break_value"
kind = "parser"
entrypoint = "expr"
preview_features = ["loop"]
source = """
loop {
    break 1;
}
"""
expected_ast = """
Expr(
  span: (0, 21),
  data: Loop(Loop(
    body: Block(
      span: (5, 16),
      statements: [
        Statement(
          span: (11, 8),
          data: Break(BreakSmt(
            value: Some(Expr(
              span: (17, 1),
              data: Integer(IntegerLiteral(
                value: 1,
              )),
            )),
          )),
        ),
      ],
    ),
  )),
)
"""

