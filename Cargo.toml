[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bindgen = "0.73.2"
cc = "1.4.6"
clap = { version = "4.6.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from"] }
indexmap = { version = "2.14.0", features = ["serde"] }
lasso = { version = "0.7.3", features = ["multi-threaded"] }
libtest-mimic = "0.8.2"
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.3.0"
ron = "0.12.2"
toml_edit = { version = "0.25.13", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
slotmap = "1.1.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
unicode-ident = "1.0.24"
quokka-lang-obj = { path = "crates/obj" }
quokka-lang-sameboy = { path = "crates/sameboy" }
quokka-lang-sameboy-sys = { path = "crates/sameboy-sys" }
quokka-lang-slotkeyset = { path = "crates/slotkeyset" }

[package]
name = "quokka-lang"
version.workspace = true
edition.workspace = true

[[test]]
name = "spec_tests"
path = "tests/spec_tests.rs"
harness = false

[[test]]
name = "optimize_soundness_tests"
path = "tests/optimize_soundness_tests.rs"
harness = false

[[test]]
name = "emulator_tests"
path = "tests/emulator_tests.rs"
harness = false

[dependencies]
clap.workspace = true
derive_more.workspace = true
indexmap.workspace = true
lasso.workspace = true
miette.workspace = true
owo-colors.workspace = true
ron.workspace = true
serde.workspace = true
slotmap.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-ident.workspace = true
quokka-lang-slotkeyset.workspace = true
quokka-lang-obj.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true
tempfile.workspace = true
toml_edit.workspace = true
quokka-lang-sameboy.workspace = true
