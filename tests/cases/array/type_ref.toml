[[case]]
name = "without_preview"
kind = "parser"
source = """
struct Name {
    field: [u8; 3],
}
"""
expected_errors = [
    "Preview feature error: use --preview array @ [25:26]",
]

[[case]]
name = "with_preview"
kind = "parser"
source = """
struct Name {
    field: [u8; 3],
}
"""
preview_features = [ "array" ]
ignored = false
expected_ast = """
Root(
  items: [
    Item(
      data: StructDecl(StructDecl(
        name: ("Name", 7, 4),
        fields: [
          FieldDecl(
            name: ("field", 18, 5),
            ty: TyRef(
              name: ("u8", 26, 2),
              count: Some(3),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""
