[[case]]
name = "true_branch_returns_no_else"
kind = "analyzer"
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let x = n;
    if n == 0 then {
        return 0;
    }
    if n == 1 then {
        x = 5;
    } else {
        x = 6;
    }
    return x;
}

fn main() {}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    x#3: u8 = copy n#2
    #4: u8 = copy 0
    #5: u1 = eq n#2, #4
    jumpif #5 != 0, .bb2, .bb3
  .bb2:
    #6: u8 = copy 0
    #RET: u8 = copy #6
    return
  .bb3:
    #7: u8 = copy 1
    #8: u1 = eq n#2, #7
    jumpif #8 != 0, .bb6, .bb7
  .bb6:
    x#9: u8 = copy 5
    jump .bb8
  .bb7:
    x#10: u8 = copy 6
    jump .bb8
  .bb8:
    x#11: u8 = phi x#9 <- .bb6, x#10 <- .bb7
    #RET: u8 = copy x#11
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

