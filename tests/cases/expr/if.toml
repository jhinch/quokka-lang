[[case]]
name = "if_with_block_statements"
kind = "parser"
entrypoint = "expr"
preview_features = ["if-else"]
ignored = false
source = """
if 1 then {
    let x = 1;
    yield x;
} else {
    yield 2;
}
"""
expected_ast = """
If(If(
  condition: Integer((IntegerLiteral(
    value: 1,
  ), 3, 1)),
  true_block: Block(Block(
    statements: [
      Let(LetSmt(
        name: ("x", 20, 1),
        value: Integer((IntegerLiteral(
          value: 1,
        ), 24, 1)),
      )),
      Yield(YieldSmt(
        value: Place(Place(
          name: ("x", 37, 1),
          field: [],
        )),
      )),
    ],
  )),
  false_block: Some(Block(Block(
    statements: [
      Yield(YieldSmt(
        value: Integer((IntegerLiteral(
          value: 2,
        ), 59, 1)),
      )),
    ],
  ))),
))
"""

[[case]]
name = "if_as_statement_without_semicolon"
kind = "parser"
entrypoint = "item"
preview_features = ["if-else"]
ignored = false
source = """
fn main() {
    if 1 then {
    } else {
    }
}
"""
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("main", 3, 4),
    ),
    body: Block(
      statements: [
        Expr(ExprSmt(
          value: If(If(
            condition: Integer((IntegerLiteral(
              value: 1,
            ), 19, 1)),
            true_block: Block(Block(
              statements: [],
            )),
            false_block: Some(Block(Block(
              statements: [],
            ))),
          )),
        )),
      ],
    ),
  )),
)
"""

[[case]]
name = "expr_statement_proceeding_if_block"
kind = "parser"
entrypoint = "item"
preview_features = ["if-else"]
ignored = false
source = """
