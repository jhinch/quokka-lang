[[case]]
name = "bit_cast_array_to_u16"
kind = "analyzer"
source = """
fn main() {
    let a: [u8; 2] = [1, 2];
    let b = a as u16;
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: [u8; 2] = alloc
    #2: u8 = copy 1
    #3: [u8; 2] = write #1[0] = #2
    #4: u8 = copy 2
    a#5: [u8; 2] = write #3[1] = #4
    b#6: u16 = bitcast a#5
    return
"""

