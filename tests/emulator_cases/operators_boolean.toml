# Covers `&&` and `||`, which (unlike the other operators) only operate on u1 and short-circuit
# their right operand.

[[case]]
name = "boolean_operator_values"
ignored = "storing a u1 result back into a `global: u1` writes an incorrect raw byte value - see the R1-to-memory Store path in codegen.rs (r1_to_r8 / the per-bit read-modify-write in Instr::Store); same bug as operators_arithmetic.toml's arithmetic_u1 case, here via && / ||. Un-ignore once fixed."
source = """
global A: u1;
global B: u1;

#[address = 0xC000]
global AND_OUT: u1;
#[address = 0xC001]
global OR_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    B = 0;
    AND_OUT = A && B;
    OR_OUT = A || B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
[[case.assertion]]
addr = 0xC001
expected = 1

[[case]]
name = "boolean_operators_short_circuit"
ignored = "Failed to allocate registers after 3 previous iterations due to successive spills for same registers {R8(R8Id(66v1))}"
source = """
global LEFT: u1;

#[address = 0xC000]
global AND_RESULT: u1;
#[address = 0xC001]
global AND_CALLED: u1;
#[address = 0xC002]
global OR_RESULT: u1;
#[address = 0xC003]
global OR_CALLED: u1;

#[address = 0x0150]
fn checkpoint() {}

fn and_rhs() -> u1 {
    AND_CALLED = 1;
    return 1;
}

fn or_rhs() -> u1 {
    OR_CALLED = 1;
    return 0;
}

fn main() {
    LEFT = 0;
    AND_CALLED = 0;
    AND_RESULT = LEFT && and_rhs();

    LEFT = 1;
    OR_CALLED = 0;
    OR_RESULT = LEFT || or_rhs();

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
[[case.assertion]]
addr = 0xC001
expected = 0 # and_rhs() must not have run since the left side of && was already false
[[case.assertion]]
addr = 0xC002
expected = 1
[[case.assertion]]
addr = 0xC003
expected = 0 # or_rhs() must not have run since the left side of || was already true
