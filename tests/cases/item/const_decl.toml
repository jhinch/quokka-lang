[[case]]
name = "builtin_const"
kind = "parser"
source = """
const A: u8 = 1;
"""
expected_ast = """
Root(
  items: [
    Item(
      data: ConstDecl(ConstDecl(
        name: ("A", (6, 1)),
        ty: TyRef(
          span: (9, 2),
          data: Simple(("u8", (9, 2))),
        ),
        value: Expr(
          span: (14, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
      )),
    ),
  ],
)
"""

[[case]]
name = "const_with_expression_value"
kind = "parser"
entrypoint = "item"
source = """
const A: u8 = 1 + 2;
"""
expected_ast = """
Item(
  data: ConstDecl(ConstDecl(
    name: ("A", (6, 1)),
    ty: TyRef(
      span: (9, 2),
      data: Simple(("u8", (9, 2))),
    ),
    value: Expr(
      span: (14, 5),
      data: Arithmetic(ArithmeticOp(
        kind: Add,
        left: Expr(
          span: (14, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
        right: Expr(
          span: (18, 1),
          data: Integer(IntegerLiteral(
            value: 2,
          )),
        ),
      )),
    ),
  )),
)
"""

[[case]]
name = "const_with_attribute"
kind = "parser"
entrypoint = "item"
source = """
#[this_attribute]
const A: u8 = 1;
"""
expected_ast = """
Item(
  attributes: [
    AttributeDecl(
      span: (0, 17),
      name: ("this_attribute", (2, 14)),
    ),
  ],
  data: ConstDecl(ConstDecl(
    name: ("A", (24, 1)),
    ty: TyRef(
      span: (27, 2),
      data: Simple(("u8", (27, 2))),
    ),
    value: Expr(
      span: (32, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

[[case]]
name = "missing_semicolon"
kind = "parser"
entrypoint = "item"
source = """
const A: u8 = 1
"""
expected_errors = [
    "Syntax error: found <EOF> when expecting ; @ [16:16]",
]

[[case]]
name = "missing_type"
kind = "parser"
entrypoint = "item"
source = """
const A = 1;
"""
expected_errors = [
    "Syntax error: found = when expecting : @ [8:9]",
]

[[case]]
name = "const_ok_with_analysis"
kind = "analyzer"
source = """
const A: u8 = 1;
fn main() {}
"""
expected_mir = """
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "const_type_checks"
kind = "analyzer"
source = """
const A: u1 = 1;
const B: u8 = A;

fn main() {}
"""
expected_errors = [
    "`u1` is not equal to `u8` @ [26:28]",
]

[[case]]
name = "const_with_return"
kind = "analyzer"
source = """
const A: u8 = {
    return 1;
};

fn main() {}
"""
expected_errors = [
    "`return` outside of a function @ [20:29]",
    "`never` is not equal to `u8` @ [9:11]",
]

[[case]]
name = "const_with_infinite_loop"
kind = "analyzer"
preview_features = ["loop"]
source = """
const A: u8 = {
    loop {}
};

fn main() {}
"""
expected_errors = [
    "`never` is not equal to `u8` @ [9:11]",
]

[[case]]
name = "const_with_continue"
kind = "analyzer"
source = """
const A: u8 = {
    continue;
};

fn main() {}
"""
expected_errors = [
    "`continue` outside of a loop @ [20:29]",
    "`never` is not equal to `u8` @ [9:11]",
]

[[case]]
name = "const_with_break"
kind = "analyzer"
source = """
const A: u8 = {
    break;
};

fn main() {}
"""
expected_errors = [
    "`break` outside of a loop @ [20:26]",
    "`never` is not equal to `u8` @ [9:11]",
]

[[case]]
name = "const_with_break_expr"
kind = "analyzer"
source = """
const A: u8 = {
    break 1;
};

fn main() {}
"""
expected_errors = [
    "`break` outside of a loop @ [20:28]",
    "`never` is not equal to `u8` @ [9:11]",
]

[[case]]
name = "const_and_fn_name_collision"
kind = "analyzer"
source = """
fn A() {}
const A: u8 = 1;
fn main() {}
"""
expected_errors = [
    "name `A` defined multiple times in scope @ [16:17]",
]

[[case]]
name = "const_initializer_referencing_undefined_name"
kind = "analyzer"
source = """
const A: u8 = undefined_name;
fn main() {}
"""
expected_errors = [
    "name `undefined_name` not defined in scope @ [14:28]",
]

[[case]]
name = "redefined_global_as_const"
kind = "analyzer"
source = """
global A: u8;
const A: u8 = 1;
fn main() {}
"""
expected_errors = [
    "name `A` defined multiple times in scope @ [20:21]",
]

[[case]]
name = "const_cannot_be_assigned"
kind = "analyzer"
source = """
const A: u8 = 1;
fn main() {
    A = 3;
}
"""
expected_errors = [
    "cannot assign to a constant @ [33:34]",
]

[[case]]
name = "global_referenced_in_const"
kind = "analyzer"
source = """
global A: u8;
const B: u8 = A;
fn main() {}
"""
expected_errors = [
    "cannot be reference global `A` in constant declaration @ [28:29]",
]

[[case]]
name = "if_in_const"
kind = "analyzer"
preview_features = ["if-else"]
source = """
const A: u8 = if 1 then 2 else 3;
fn main() {}
"""
expected_errors = [
    "if expression are not support in constant declarations @ [14:32]",
]

[[case]]
name = "loop_in_const"
kind = "analyzer"
preview_features = ["loop"]
source = """
const A: u8 = loop {
    break 1;
};
fn main() {}
"""
expected_errors = [
    "loops are not support in constant declarations @ [14:35]",
]

[[case]]
name = "call_in_const"
kind = "analyzer"
preview_features = ["function-call"]
source = """
const A: u8 = one();
fn one() -> u8 { return 1; }
fn main() {}
"""
expected_errors = [
    "function calls are not support in constant declarations @ [14:19]",
]
