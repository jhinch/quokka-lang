# Covers additions and subtractions of a small constant, which codegen lowers to `INC`/`DEC` steps
# rather than an addition through the accumulator: `INC r8`/`DEC r8` for an 8-bit `+-1` and `+-2`,
# and for a 16-bit `+-1` a byte-at-a-time step that branches over the carry (or borrow) into the
# high byte. `INC r16`/`DEC r16` are not used for these as they corrupt OAM when the register holds
# an address in `$FE00-$FEFF`.
#
# The cases sit on the wrap boundaries of each width and of the low byte, and each also asserts the
# left operand's local wasn't corrupted by computing the result. The `*_keeps_*` cases check a
# comparison result computed before the step is still intact after it, the `*_through_oam_range`
# cases walk a value across the whole of OAM so the harness's OAM corruption check sees every step,
# and the `struct_array_*` cases cover the `INC HL` used to step an address from an array element
# to one of its fields.

[[case]]
name = "add_u8_one"
source = """
global LEFT: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global LEFT_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    LEFT = 0x41 as u8;
    let left = LEFT;
    let result = left + 1;
    OUT = result;
    LEFT_OUT = left;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x42 # 0x42
[[case.assertion]]
addr = 0xC001
expected = 0x41 # 0x41

