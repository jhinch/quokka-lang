# There are only 2 physical flag registers (Z and C). Keeping 3 comparison results
# (`u1`/bool-typed locals, which live in a zero- or carry-flag virtual register) simultaneously
# live forces `RegAllocator` down the flag-spill path (`PushAF`/`Rlc`/`Sbc` dance in
# `store_spill_slot`/`load_spill_slot` for `VirtualReg::Zero`/`VirtualReg::Carry`), which has no
# other coverage in this suite.

