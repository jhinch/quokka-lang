[[case]]
name = "if_true_branch_diverges_is_ok"
kind = "analyzer"
preview_features = ["if-else"]
source = """
fn foo() -> u8 {
    let c: u1 = 1;
    if c then {
        return 1;
    } else {
        return 2;
    }
}
"""
expected_mir = """
foo -> u8:
  .bb1:
    c#2: <unresolved> = copy 1
    #3: u1 = copy c#2
    #4: u1 = copy #3
    jumpif #4 != 0, .bb2, .bb3
  .bb2:
    #RET: u8 = copy 1
    return
  .bb3:
    #RET: u8 = copy 2
    return
"""
