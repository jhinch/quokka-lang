# outer_substitutions` (the spill-eviction rename map `src/regalloc.rs` uses
# to bracket a `LD HL, SP+e8` spill-slot address computation with `PUSH`/`POP` around an
# already-precolored `HL`/`A`/`Fz`/`Fc` register - see `spill_reload_regressions.toml`) only
# rewrites occurrences within the single block where the eviction happens. That is only sound
# if a precolored register is never live *out* of a block in the first place.
# `CodeSectionData::check_integrity` (`src/lir.rs`) asserts the invariant directly: it
# computes real liveness and fails (in debug builds, i.e. every test run) if any precolored
# register is live-out of any block. `RegAllocator` calls `check_integrity` after
# every spill-rewrite round, so any case below that forces a spill would immediately panic on
# compilation if this invariant - and therefore the soundness of the same-block-only rename - ever
# stopped holding for real Quokka programs.
#
# Every case here forces at least one spill (more simultaneously-live locals of some kind than
# there are physical registers - see `spilling.toml`/`flags.toml` in `tests/cases/codegen` for the
# same technique) *inside one region of a branchy or looping control-flow graph*, while a sibling
# block (the other arm of an if, an outer/later part of a loop, code after the branch merges)
# stays under pressure and must be completely unaffected. Each stresses a different kind of block
# boundary the eviction rename must not need to cross:
#
# - if/else where only one arm spills (both as a statement and as a value-producing expression
#   merged through a phi)
# - a value that is live *into and out of* a branch (spans the merge block) while the branch body
#   spills internally
# - a nested if, where only the inner branch spills
# - a loop body that spills every iteration, with an accumulator carried live across the
#   loop's back edge
# - a loop where only one iteration's inner branch spills
# - the r16 and flag (Fz/Fc) spill paths, not just r8, inside a branch

