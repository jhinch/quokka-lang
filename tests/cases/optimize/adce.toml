[[case]]
name = "keeps_branch_whose_only_instruction_is_breakpoint"
kind = "analyzer"
optimize = true
preview_features = ["breakpoint", "no-canonicalize", "no-sccp", "no-prune"]
source = """
global IN: u8;

fn main() {
    if IN == 1 then {
        breakpoint;
    }
}
"""
expected_mir = """
global IN: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: u8 = load IN
    #2: u8 = copy 1
    #3: u1 = eq #1, #2
    jumpif #3 != 0, .bb2, .bb3
  .bb2:
    breakpoint
    jump .bb3
  .bb3:
    return
"""

[[case]]
name = "keeps_breakpoint_with_all_passes_enabled"
kind = "analyzer"
optimize = true
preview_features = ["breakpoint"]
source = """
global IN: u8;

fn main() {
    breakpoint;
    if IN == 1 then {
        breakpoint;
    }
    loop {
        breakpoint;
        if IN == 2 then {
            break;
        }
    }
}
"""
expected_mir = """
global IN: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    breakpoint
    #1: u8 = load IN
    #3: u1 = eq #1, 1
    jumpif #3 != 0, .bb2, .bb3
  .bb2:
    breakpoint
    jump .bb3
  .bb3:
    jump .bb4
  .bb4:
    breakpoint
    #4: u8 = load IN
    #6: u1 = eq #4, 2
    jumpif #6 != 0, .bb5, .bb4
  .bb5:
    return
"""

# The then arm holds no instruction of its own but is the only edge giving the phis `b`, so the
# branch choosing it must stay.
[[case]]
name = "preserves_branch_whose_arm_only_forwards_a_value_to_a_phi"
kind = "analyzer"
optimize = true
preview_features = ["no-canonicalize", "no-sccp", "no-prune"]
source = """
global A: u8;
global B: u8;
global R: u8;
global S: u8;

fn main() {
    let a = A;
    let b = B;
    let r = a;
    let s = a;
    if b == 7 then {
        s = b;
        r = s;
    }
    R = r;
    S = s;
}
"""
expected_mir = """
global A: u8
global B: u8
global R: u8
global S: u8

@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u8 = load A
    b#2: u8 = load B
    r#3: u8 = copy a#1
    s#4: u8 = copy a#1
    #5: u8 = copy 7
    #6: u1 = eq b#2, #5
    jumpif #6 != 0, .bb2, .bb3
  .bb2:
    jump .bb3
  .bb3:
    r#7: u8 = phi r#3 <- .bb1, b#2 <- .bb2
    store R = r#7
    s#8: u8 = phi s#4 <- .bb1, b#2 <- .bb2
    store S = s#8
    return
"""
