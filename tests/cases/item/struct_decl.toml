[[case]]
name = "single_field"
kind = "parser"
source = """
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: StructDecl(StructDecl(
        name: ("Name", 7, 4),
        fields: [
          FieldDecl(
            name: ("field", 18, 5),
            ty: TyRef(
              name: ("u8", 25, 2),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""

[[case]]
name = "struct_with_attribute"
kind = "parser"
source = """
#[this_attribute]
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          name: ("this_attribute", 2, 14),
        ),
      ],
      data: StructDecl(StructDecl(
        name: ("Name", 25, 4),
        fields: [
          FieldDecl(
            name: ("field", 36, 5),
            ty: TyRef(
              name: ("u8", 43, 2),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""


