[package]
name = "quokka-lang"
version = "0.1.0"
edition = "2024"

[[test]]
name = "spec_tests"
path = "tests/spec_tests.rs"
harness = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["from"] }
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.2.2"
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
slotmap = "1.1.1"
thiserror = "2.0.18"
unicode-ident = "1.0.24"

[dev-dependencies]
assert_matches = "1.5.0"
libtest-mimic = "0.8.2"
toml_edit = { version = "0.25.12", features = ["serde"] }
