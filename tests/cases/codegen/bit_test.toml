# Instruction selection of single-bit mask tests. `(x & m) == 0` and `(x & m) != 0` with a
# single-bit literal `m` are selected as a `BIT` of `x`, so the compare reads neither the `AND`
# nor the zero. Each of those is only lowered if something else still reads it.

