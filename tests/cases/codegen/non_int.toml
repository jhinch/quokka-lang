[[case]]
name = "bit16_struct"
kind = "codegen"
allocate_registers = true
source = """
struct OptionalInt {
    is_some: u1,
    value: u8,
}

global IN: OptionalInt;
global OUT: OptionalInt;

fn foo() {
    let v = IN;
    OUT = v;
}
fn main() {}
"""
expected_lir = """
START_SECTION WRAM0[0]
IN::
alloc 16 x bit
END_SECTION

START_SECTION WRAM0[0]
OUT::
alloc 16 x bit
END_SECTION

START_SECTION ROM0
foo::
.bb1:
  LD HL, IN+$0000
  LD A, [HL++]
  LD B, [HL]
  LD HL, OUT+$0000
  LD [HL++], A
  LD [HL], B
  RET

END_SECTION

START_SECTION ROM0[256]
main::
.bb1:
  RET

END_SECTION
"""

[[case]]
name = "fn_ptr"
kind = "codegen"
allocate_registers = true
source = """
global CHOICE: u1;

fn ping_or_pong() {
    let f = if CHOICE then ping else pong;
    f();
}

fn ping() {}

fn pong() {}

fn main() {}
"""
expected_lir = """
START_SECTION WRAM0[0]
CHOICE::
alloc 1 x bit
END_SECTION

START_SECTION ROM0
ping_or_pong::
.bb1:
  LD HL, CHOICE+$0000
  LD A, [HL]
  BIT 0, A; z
  JP z, .bb4; else=.bb5

ping::
.bb2:
  RET

pong::
.bb3:
  RET

.bb4:
  LD HL, ping
  JP .bb6

.bb5:
  LD HL, pong
  JP .bb6

.bb6:
  CALL HL; return=.bb7

.bb7:
  RET

END_SECTION

START_SECTION ROM0[256]
main::
.bb1:
  RET

END_SECTION
"""
