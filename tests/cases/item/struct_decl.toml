[[case]]
name = "empty_struct"
kind = "parser"
entrypoint = "item"
source = """
struct Name {}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("Name", (7, 4)),
    fields: [],
  )),
)
"""

[[case]]
name = "multiple_fields"
kind = "parser"
entrypoint = "item"
source = """
struct Point {
    x: u8,
    y: u8,
}
"""
expected_ast = """
Item(
  data: StructDecl(StructDecl(
    name: ("Point", (7, 5)),
    fields: [
      FieldDecl(
        name: ("x", (19, 1)),
        ty: TyRef(
          span: (22, 2),
          name: ("u8", (22, 2)),
        ),
      ),
      FieldDecl(
        name: ("y", (30, 1)),
        ty: TyRef(
          span: (33, 2),
          name: ("u8", (33, 2)),
        ),
      ),
    ],
  )),
)
"""

[[case]]
name = "multiple_fields_no_trailing_comma"
kind = "parser"
entrypoint = "item"
source = """
