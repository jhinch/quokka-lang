]

[[case]]
name = "if_condition_bool_ok"
kind = "analyzer"
source = """
fn main() {
    let c: u1 = 1;
    if c then {
    } else {
    }
}
"""
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    c#1: u1 = copy 1
    jumpif c#1 != 0, .bb2, .bb3
  .bb2:
    jump .bb4
  .bb3:
    jump .bb4
  .bb4:
    return
"""

