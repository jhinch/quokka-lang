[[case]]
name = "arithmetic_u16"
source = """
global A: u16;
global B: u16;

#[address = 0xC000]
global AND_OUT: u16;
#[address = 0xC002]
global OR_OUT: u16;
#[address = 0xC004]
global XOR_OUT: u16;
#[address = 0xC006]
global ADD_OUT: u16;
#[address = 0xC008]
global SUB_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x1234;
    B = 0x00FF;
    AND_OUT = A & B;
    OR_OUT = A | B;
    XOR_OUT = A ^ B;

    A = 0xFFFF;
    B = 0x0001;
    ADD_OUT = A + B;

    // low byte needs a borrow from the high byte: 0x00 - 0x01
    A = 0x1000;
    B = 0x0001;
    SUB_OUT = A - B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x34, 0x00] # 0x0034
[[case.assertion]]
addr = 0xC002
expected = [0xFF, 0x12] # 0x12FF
[[case.assertion]]
addr = 0xC004
expected = [0xCB, 0x12] # 0x12CB
[[case.assertion]]
addr = 0xC006
expected = [0x00, 0x00] # wraps to 0x0000
[[case.assertion]]
addr = 0xC008
expected = [0xFF, 0x0F] # 0x0FFF

[[case]]
name = "u16_subtraction_borrow_regression"
source = """
global A: u16;
global B: u16;

#[address = 0xC000]
global BORROW_OUT: u16;
#[address = 0xC002]
global NO_BORROW_OUT: u16;
#[address = 0xC004]
global FULL_WRAP_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    // low byte requires a borrow from the high byte (0x00 - 0x01); with the bug, the high byte's
    // SUB ran before the low byte's, so the borrow never reached the high byte
    A = 0x1000;
    B = 0x0001;
    BORROW_OUT = A - B;

    // no borrow needed, but the bytes are deliberately asymmetric so a high/low byte swap would
    // still be caught
    A = 0x8642;
    B = 0x0111;
    NO_BORROW_OUT = A - B;

    // borrow chains all the way through both bytes
    A = 0x0000;
    B = 0x0001;
    FULL_WRAP_OUT = A - B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0xFF, 0x0F] # 0x0FFF
[[case.assertion]]
addr = 0xC002
expected = [0x31, 0x85] # 0x8531
[[case.assertion]]
addr = 0xC004
expected = [0xFF, 0xFF] # 0xFFFF

[[case]]
name = "u16_literal_load_byte_order"
source = """
#[address = 0xC000]
global A: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x1234;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x34, 0x12] # low byte first, then high byte

[[case]]
name = "compound_assign_u1"
source = """
global A: u1;

#[address = 0xC000]
global ADD_OUT: u1;
#[address = 0xC001]
global SUB_OUT: u1;
#[address = 0xC002]
global AND_OUT: u1;
#[address = 0xC003]
global OR_OUT: u1;
#[address = 0xC004]
global XOR_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    A += 1;
    ADD_OUT = A;

    A = 0;
    A -= 1;
    SUB_OUT = A;

    A = 1;
    A &= 1;
    AND_OUT = A;

    A = 0;
    A |= 1;
    OR_OUT = A;

    A = 1;
    A ^= 1;
    XOR_OUT = A;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC004
expected = 0
mask = 0b0000_0001

