[[case]]
name = "zero"
kind = "parser"
entrypoint = "expr"
source = """
0
"""
expected_ast = """
Expr(
  span: SourceSpan(
    offset: SourceOffset(0),
    length: 1,
  ),
  data: Integer(Spanned(
    data: IntegerLiteral(
      value: 0,
    ),
    span: SourceSpan(
      offset: SourceOffset(0),
      length: 1,
    ),
  )),
)
"""

