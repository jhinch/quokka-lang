[[case]]
name = "reference_example_chain_u16_to_array"
source = """
struct BytePair {
    low: u8,
    high: u8,
}

global A: u16;

#[address = 0xC000]
global OUT: [u8; 2];

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x1234;
    let a = A;
    let b = a as u16;
    let c = b as i16;
    let d = c as BytePair;
    let e = d as [u8; 2];
    OUT = e;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x34, 0x12]

[[case]]
name = "u16_to_struct_decomposes_into_fields"
source = """
struct BytePair {
    low: u8,
    high: u8,
}

global A: u16;
global P: BytePair;

#[address = 0xC000]
global OUT_LOW: u8;
#[address = 0xC001]
global OUT_HIGH: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0xABCD;
    let v = A;
    P = v as BytePair;
    OUT_LOW = P.low;
    OUT_HIGH = P.high;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0xCD
[[case.assertion]]
addr = 0xC001
expected = 0xAB

[[case]]
name = "array_to_u16_combines_little_endian"
source = """
global A: [u8; 2];

#[address = 0xC000]
global OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A[0] = 0x78;
    A[1] = 0x56;
    let v = A;
    OUT = v as u16;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x78, 0x56]
