[[case]]
name = "grouped_number"
kind = "parser"
entrypoint = "expr"
source = """
(1)
"""
expected_ast = """
Expr(
  span: SourceSpan(
    offset: SourceOffset(0),
    length: 3,
  ),
  data: Paren(Expr(
    span: SourceSpan(
      offset: SourceOffset(1),
      length: 1,
    ),
    data: Integer(IntegerLiteral(
      value: 1,
    )),
  )),
)
"""

[[case]]
name = "grouped_overrides_precedence"
kind = "parser"
entrypoint = "expr"
source = """
(1 + 2) << 1
"""
expected_ast = """
Expr(
  span: SourceSpan(
    offset: SourceOffset(0),
    length: 12,
  ),
  data: Binary(BinaryOp(
    kind: ShiftLeft,
    left: Expr(
      span: SourceSpan(
        offset: SourceOffset(0),
        length: 7,
      ),
      data: Paren(Expr(
        span: SourceSpan(
          offset: SourceOffset(1),
          length: 5,
        ),
        data: Binary(BinaryOp(
          kind: Add,
          left: Expr(
            span: SourceSpan(
              offset: SourceOffset(1),
              length: 1,
            ),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: SourceSpan(
              offset: SourceOffset(5),
              length: 1,
            ),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      )),
    ),
    right: Expr(
      span: SourceSpan(
        offset: SourceOffset(11),
        length: 1,
      ),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

