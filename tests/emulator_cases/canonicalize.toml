source = """
global N: u8;
global M: u8;
global C: u8;

#[address = 0xC000]
global SWAPPED: u8;
#[address = 0xC001]
global NEGATED: u8;
#[address = 0xC002]
global FOLDED: u8;
#[address = 0xC003]
global TESTED: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    SWAPPED = 0;
    NEGATED = 0;
    FOLDED = 0;
    TESTED = 0;
    N = 0x35;
    M = 0x0A;
    C = 0;
    let n = N;
    let m = M;
    let a = n + 5;
    let k = !m;
    let b = n + 3;
    let masked = n & 0x10;
    if C == 0 then {
        SWAPPED = a - m;
        NEGATED = k + 1;
        FOLDED = b + 10;
        if masked == 0x10 then {
            TESTED = 1;
        }
    }

    checkpoint();
}
"""
