[[case]]
name = "diamond_blocks_with_empty_branch_trims_empty_block"
kind = "analyzer"
optimize = true
preview_features = ["prune"]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let x = 11;
    if n == 0 then {
    } else {
        x = 22;
    }
    return x;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    x#3: u8 = copy 11
    #4: u8 = copy 0
    #5: u1 = eq n#2, #4
    jumpif #5 != 0, .bb4, .bb3
  .bb4:
    x#7: u8 = phi x#3 <- .bb1, x#6 <- .bb3
    #RET: u8 = copy x#7
    return
  .bb3:
    x#6: u8 = copy 22
    jump .bb4

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""
