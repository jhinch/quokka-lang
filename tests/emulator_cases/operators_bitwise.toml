[[case.assertion]]
addr = 0xC002
expected = [0xFF, 0x00]

[[case]]
name = "shift_left_u8"
source = """
global IN: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global IN_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b10000001;
    let in_ = IN;
    let result = in_ <<;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0b00000010 # top bit dropped, 0 shifted in
[[case.assertion]]
addr = 0xC001
expected = 0b10000001

[[case]]
name = "shift_right_u8"
source = """
global IN: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global IN_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b10000001;
    let in_ = IN;
    let result = in_ >>;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0b01000000 # bottom bit dropped, 0 shifted in (unsigned = logical shift)
[[case.assertion]]
addr = 0xC001
expected = 0b10000001

[[case]]
name = "rotate_left_u8"
source = """
global IN: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global IN_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b10000001;
    let in_ = IN;
    let result = in_ <%;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0b00000011 # top bit wraps around to the bottom
[[case.assertion]]
addr = 0xC001
expected = 0b10000001

[[case]]
name = "rotate_right_u8"
source = """
global IN: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global IN_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b10000001;
    let in_ = IN;
    let result = in_ >%;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0b11000000 # bottom bit wraps around to the top
[[case.assertion]]
addr = 0xC001
expected = 0b10000001

[[case]]
name = "shift_left_u16"
source = """
global IN: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global IN_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0x8001;
    let in_ = IN;
    let result = in_ <<;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x02, 0x00] # 0x8001 << 1 = 0x0002 (bit 15 dropped, low byte's bit 7 was 0 so no carry in)
[[case.assertion]]
addr = 0xC002
expected = [0x01, 0x80]

[[case]]
name = "shift_right_u16"
source = """
global IN: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global IN_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0x8001;
    let in_ = IN;
    let result = in_ >>;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x00, 0x40] # 0x8001 >> 1 = 0x4000 (unsigned/logical shift)
[[case.assertion]]
addr = 0xC002
expected = [0x01, 0x80]

[[case]]
name = "rotate_left_u16"
source = """
global IN: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global IN_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0x8001;
    let in_ = IN;
    let result = in_ <%;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x03, 0x00] # 0x8001 rotated left = 0x0003 (bit 15 wraps to bit 0)
[[case.assertion]]
addr = 0xC002
expected = [0x01, 0x80]

[[case]]
name = "rotate_right_u16"
source = """
global IN: u16;

#[address = 0xC000]
global OUT: u16;
#[address = 0xC002]
global IN_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0x8001;
    let in_ = IN;
    let result = in_ >%;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x00, 0xC0] # 0x8001 rotated right = 0xC000 (bit 0 wraps to bit 15)
[[case.assertion]]
addr = 0xC002
expected = [0x01, 0x80]
