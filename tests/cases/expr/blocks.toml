[[case]]
name = "block_as_if_branch"
kind = "parser"
entrypoint = "expr"
preview_features = ["if-else", "loop"]
ignored = false
source = """
if 1 then {
    loop {
        break;
    }
} else {
}
"""
expected_ast = """
Expr(
  span: SourceSpan(
    offset: SourceOffset(0),
    length: 54,
  ),
  data: If(If(
    condition: Expr(
      span: SourceSpan(
        offset: SourceOffset(3),
        length: 1,
