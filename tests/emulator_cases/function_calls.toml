addr = 0xC000
expected = 9

# Coverage for the u1-return ABI-forcing fix (`f123e08`) on the path where the returned condition
# isn't already `NotZero` and needs complementing (`!=` negates `eq_from_comparison_op`'s
# condition) before it's materialized into `A` - `call_returns_u1_value` above only exercises a
# literal return, which never takes that `cpl` path.
[[case]]
name = "call_returns_u1_from_eq_comparison_true"
source = """
#[address = 0xC000]
global OUT: u8;

fn eq_check() -> u1 {
    let a: u8 = 5;
    let b: u8 = 5;
    return a == b;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    OUT = 0;
    if eq_check() then {
        OUT = 1;
    }
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1

[[case]]
name = "call_returns_u1_from_ne_comparison_false"
source = """
#[address = 0xC000]
global OUT: u8;

fn neq_check() -> u1 {
    let a: u8 = 5;
    let b: u8 = 5;
    return a != b;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    OUT = 7;
    if neq_check() then {
        OUT = 1;
    }
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 7
