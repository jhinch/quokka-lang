fn main() {
    A = 0x11;
    let a = A;
    let f = helper;
    let h = f();
    OUT_A = a;
    OUT_HELPER = h;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x11
[[case.assertion]]
addr = 0xC001
expected = 0x65
