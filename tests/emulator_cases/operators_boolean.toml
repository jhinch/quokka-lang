# Covers `&&` and `||`, which (unlike the other operators) only operate on u1 and short-circuit
# their right operand.

[[case]]
name = "boolean_operator_values"
source = """
global A: u1;
global B: u1;

#[address = 0xC000]
global AND_OUT: u1;
#[address = 0xC001]
global OR_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    B = 0;
    AND_OUT = A && B;
    OR_OUT = A || B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001

[[case]]
name = "boolean_operators_short_circuit"
source = """
global LEFT: u1;

#[address = 0xC000]
global AND_RESULT: u1;
#[address = 0xC001]
global AND_CALLED: u1;
#[address = 0xC002]
global OR_RESULT: u1;
#[address = 0xC003]
global OR_CALLED: u1;

#[address = 0x0150]
fn checkpoint() {}

fn and_rhs() -> u1 {
    AND_CALLED = 1;
    return 1;
}

fn or_rhs() -> u1 {
    OR_CALLED = 1;
    return 0;
}

fn main() {
    LEFT = 0;
    AND_CALLED = 0;
    AND_RESULT = LEFT && and_rhs();

    LEFT = 1;
    OR_CALLED = 0;
    OR_RESULT = LEFT || or_rhs();

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 0 # and_rhs() must not have run since the left side of && was already false
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 0 # or_rhs() must not have run since the left side of || was already true
mask = 0b0000_0001
