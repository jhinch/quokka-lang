[[case]]
name = "array_index_with_bare_literal"
kind = "analyzer"
preview_features = ["array"]
ignored = false
source = """
global A: [u8; 3];
fn main() {
    let v: u8 = A[0];
}
"""

[[case]]
name = "array_index_requires_unsigned_int"
kind = "analyzer"
preview_features = ["array"]
ignored = false
source = """
global A: [u8; 3];
fn main() {
    let idx: i8 = 1;
    let v: u8 = A[idx];
}
"""
expected_errors = [
    "`i8` is not equal to `u16` @ [70:73]",
]

