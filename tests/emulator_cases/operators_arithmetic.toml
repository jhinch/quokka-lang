[[case]]
name = "compound_assign_u16"
source = """
global A: u16;

#[address = 0xC000]
global ADD_OUT: u16;
#[address = 0xC002]
global SUB_OUT: u16;
#[address = 0xC004]
global AND_OUT: u16;
#[address = 0xC006]
global OR_OUT: u16;
#[address = 0xC008]
global XOR_OUT: u16;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0xFFFF;
    A += 0x0001;
    ADD_OUT = A;

    // exercises the same low-byte-borrow path as the plain `-` operator, but through the
    // compound-assign codegen path instead
    A = 0x1000;
    A -= 0x0001;
    SUB_OUT = A;

    A = 0x1234;
    A &= 0x00FF;
    AND_OUT = A;

    A = 0x1234;
    A |= 0x00FF;
    OR_OUT = A;

    A = 0x1234;
    A ^= 0x00FF;
    XOR_OUT = A;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = [0x00, 0x00]
[[case.assertion]]
addr = 0xC002
expected = [0xFF, 0x0F]
[[case.assertion]]
addr = 0xC004
expected = [0x34, 0x00]
[[case.assertion]]
addr = 0xC006
expected = [0xFF, 0x12]
[[case.assertion]]
addr = 0xC008
expected = [0xCB, 0x12]
