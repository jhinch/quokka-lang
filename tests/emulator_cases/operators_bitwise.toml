# Covers the single-operand `NotExpression`, `ShiftExpression` and `RotateExpression` forms, one
# operator and width per case. Each case binds the operand into a `let` local first (rather than
# applying the operator directly to a global read, which has no local to re-read afterwards - see
# `docs/src/reference/statements/lets.md`) and checks both the result and that the operand's local
# was not corrupted by computing it.

[[case]]
name = "not_u1"
source = """
global IN: u1;

#[address = 0xC000]
global OUT: u1;
#[address = 0xC001]
global IN_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 1;
    let in_ = IN;
    let result = !in_;
    OUT = result;
    IN_OUT = in_;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001

