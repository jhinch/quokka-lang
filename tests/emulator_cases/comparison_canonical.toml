# Covers comparisons against a literal with canonicalization enabled, which rewrites them to put
# the literal on the right and to read the carry flag where it can. Each case computes the
# comparison once as a stored value and once as a branch condition, for an input on which it holds
# and one on which it does not.

[[case]]
name = "eq_zero"
preview_features = ["canonicalize"]
source = """
global IN: u8;

#[address = 0xC000]
global VALUE_HOLDS: u1;
#[address = 0xC001]
global VALUE_FAILS: u1;
#[address = 0xC002]
global BRANCH_HOLDS: u8;
#[address = 0xC003]
global BRANCH_FAILS: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    BRANCH_HOLDS = 0;
    BRANCH_FAILS = 0;

    IN = 0;
    let x = IN;
    VALUE_HOLDS = x == 0;
    if x == 0 then {
        BRANCH_HOLDS = 1;
    }

    IN = 1;
    let x = IN;
    VALUE_FAILS = x == 0;
    if x == 0 then {
        BRANCH_FAILS = 1;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
[[case.assertion]]
addr = 0xC003
expected = 0

