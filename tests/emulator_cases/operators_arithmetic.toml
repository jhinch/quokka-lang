[[case]]
name = "arithmetic_u1"
source = """
global A: u1;
global B: u1;

#[address = 0xC000]
global AND_OUT: u1;
#[address = 0xC001]
global OR_OUT: u1;
#[address = 0xC002]
global XOR_OUT: u1;
#[address = 0xC003]
global ADD_OUT: u1;
#[address = 0xC004]
global SUB_OUT: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 1;
    B = 1;
    AND_OUT = A & B;

    A = 0;
    B = 1;
    OR_OUT = A | B;

    A = 1;
    B = 1;
    XOR_OUT = A ^ B;

    A = 1;
    B = 1;
    ADD_OUT = A + B;

    A = 0;
    B = 1;
    SUB_OUT = A - B;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC004
expected = 1
mask = 0b0000_0001

