[[case]]
name = "named_const_read_in_several_blocks_is_sound"
inputs = { C = [0, 1], M = [0, 1, 128, 255], N = [{ min = 0, max = 255 }] }
params = { K = [1, 2, 128, 200] }
expect_rewrite = ["canonicalize"]
source = """
const K: u8 = $K$;
global N: u8;
global M: u8;
global C: u8;

fn f() -> u8 {
    let n = N;
    let m = M;
    let a = n + K;
    let r = a - m;
    if C == 0 then {
        r = (r + K) - 1;
    }
    loop {
        if r >= K then {
            break;
        }
        r = (r | 1) + K;
    }
    return r ^ K;
}

fn main() {
    N = 1;
    M = 1;
    C = 1;
    f();
}
"""

# The cases below branch on a comparison which canonicalize folds to a constant, with a variable
# assigned under the branch and read after it. The comparison is not a constant to the analyzer, so
# the branch is only removed by the passes which run after canonicalize.

