[[case]]
name = "u2_without_preview"
kind = "analyzer"
source = """
global A: u2;
fn main() {}
"""
expected_errors = [
    "Preview feature error: use --preview narrow-int @ [10:12]",
]

[[case]]
name = "u2_with_preview"
kind = "analyzer"
preview_features = [ "narrow-int" ]
source = """
global A: u2;
fn main() {}
"""
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global A: u2

main -> unit:
  .bb1:
    return
"""

