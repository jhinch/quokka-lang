[[case]]
name = "global_struct_field_read"
source = """
struct Point { x: u8, y: u8 }
global P: Point;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    P.x = 10;
    P.y = 20;
    OUT = P.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 20

[[case]]
name = "global_struct_field_write_does_not_corrupt_sibling_field"
source = """
struct Point { x: u8, y: u8 }
global P: Point;

#[address = 0xC000]
global OUT_X: u8;
#[address = 0xC001]
global OUT_Y: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    P.x = 10;
    P.y = 20;
    P.x = 99;
    OUT_X = P.x;
    OUT_Y = P.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 99
[[case.assertion]]
addr = 0xC001
expected = 20 # writing x must not disturb y

[[case]]
name = "local_field_read"
preview_features = ["local-field-access"]
source = """
struct Point { x: u8, y: u8 }
global P: Point;

#[address = 0xC000]
global OUT_X: u8;
#[address = 0xC001]
global OUT_Y: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    P.x = 10;
    P.y = 20;
    let p = P;
    OUT_X = p.x;
    OUT_Y = p.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 10
[[case.assertion]]
addr = 0xC001
expected = 20

[[case]]
name = "local_field_read_does_not_corrupt_source_local"
preview_features = ["local-field-access"]
source = """
struct Point { x: u8, y: u8 }
global P: Point;

#[address = 0xC000]
global OUT_Y: u8;
#[address = 0xC001]
global P_OUT: [u8; 2];

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    P.x = 10;
    P.y = 20;
    let p = P;
    OUT_Y = p.y;
    P_OUT[0] = p.x;
    P_OUT[1] = p.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 20
[[case.assertion]]
addr = 0xC001
expected = [10, 20]

[[case]]
name = "local_field_write"
preview_features = ["local-field-access"]
source = """
struct Point { x: u8, y: u8 }

#[address = 0xC000]
global OUT_X: u8;
#[address = 0xC001]
global OUT_Y: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    let p: Point = Point { x: 1, y: 2 };
    p.x = 99;
    OUT_X = p.x;
    OUT_Y = p.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 99
[[case.assertion]]
addr = 0xC001
expected = 2 # writing x (low byte) must not disturb y (high byte)

[[case]]
name = "local_field_write_high_byte_does_not_corrupt_low_byte"
preview_features = ["local-field-access"]
source = """
struct Point { x: u8, y: u8 }

#[address = 0xC000]
global OUT_X: u8;
#[address = 0xC001]
global OUT_Y: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    let p: Point = Point { x: 1, y: 2 };
    p.y = 99;
    OUT_X = p.x;
    OUT_Y = p.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1 # writing y (high byte) must not disturb x (low byte)
[[case.assertion]]
addr = 0xC001
expected = 99

[[case]]
name = "local_field_write_does_not_corrupt_source_local"
preview_features = ["local-field-access"]
source = """
struct Point { x: u8, y: u8 }
global P: Point;

#[address = 0xC000]
global OUT_X: u8;
#[address = 0xC001]
global OUT_Y: u8;
#[address = 0xC002]
global P_OUT: [u8; 2];

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    P.x = 10;
    P.y = 20;
    let p = P;
    p.x = 88;
    p.y = 99;
    OUT_X = p.x;
    OUT_Y = p.y;
    P_OUT[0] = P.x;
    P_OUT[1] = P.y;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 88
[[case.assertion]]
addr = 0xC001
expected = 99
[[case.assertion]]
addr = 0xC002
expected = [10, 20] # writing the local copy's fields must not reach back into the global
