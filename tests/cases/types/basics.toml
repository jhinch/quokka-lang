[[case]]
name = "redefined_fn"
kind = "analyzer"
source = """
fn foo() {}
fn foo() {}
fn main() {}
"""
expected_errors = [
    "name `foo` defined multiple times in scope @ [15:18]",
]

[[case]]
name = "redefined_global_and_const"
kind = "analyzer"
source = """
global A: u8;
const A: u8 = 1;
fn main() {}
"""
expected_errors = [
    "name `A` defined multiple times in scope @ [20:21]",
]

[[case]]
name = "not_defined_place"
kind = "analyzer"
source = """
fn main() {
    x;
}
"""
expected_errors = [
    "name `x` not defined in scope @ [16:17]",
]

[[case]]
name = "break_outside_loop"
kind = "analyzer"
source = """
fn main() {
    break;
}
"""
expected_errors = [
    "`break` outside of a loop @ [16:22]",
]

[[case]]
name = "break_with_value_from_unit_loop"
kind = "analyzer"
source = """
fn main() {
    loop {
        let a: u8 = 1;
        break a;
    }
}
"""
expected_errors = [
    "cannot `break` with value from a unit loop @ [16:68]",
]

[[case]]
name = "continue_outside_loop"
kind = "analyzer"
source = """
fn main() {
    continue;
}
"""
expected_errors = [
    "`continue` outside of a loop @ [16:25]",
]

[[case]]
name = "yield_outside_block"
kind = "analyzer"
source = """
fn main() {
    yield 1;
}
"""
expected_errors = [
    "`yield` outside of a block @ [16:24]",
]

[[case]]
name = "yield_in_unit_block"
kind = "analyzer"
source = """
fn main() {
    let a: u8 = 1;
    {
        let b: u8 = 2;
        yield a;
    }
}
"""
expected_errors = [
    "cannot `yield` from a unit block @ [35:82]",
]


[[case]]
name = "return_value_missing"
kind = "analyzer"
source = """
fn foo() -> u8 {
    return;
}
fn main() {}
"""
expected_errors = [
    "`return` missing a value @ [12:14]",
]

[[case]]
name = "return_value_unexpected"
kind = "analyzer"
source = """
fn foo() {
    let a: u8 = 1;
    return a;
}
fn main() {}
"""
expected_errors = [
    "unexpected `return` value @ [3:6]",
]

[[case]]
name = "return_with_no_value_matches_unit_return_ty"
kind = "analyzer"
source = """
fn foo() {
    return;
}
fn main() {}
"""
expected_mir = """
foo -> unit:
  .bb1:
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    return
"""

[[case]]
name = "fn_falls_through_without_return_is_error"
kind = "analyzer"
source = """
fn foo() -> u8 {
}
fn main() {}
"""
expected_errors = [
    "`return` missing in block @ [17:18]",
]

[[case]]
name = "unreachable_code_after_return"
kind = "analyzer"
source = """
fn main() {
    return;
    let x: u8 = 1;
    x;
}
"""
expected_errors = [
    "unreachable code @ [28:49]",
]

[[case]]
name = "const_undefined_type"
kind = "analyzer"
source = """
const A: NotAType = 1;
fn main() {}
"""
expected_errors = [
    "cannot find type `NotAType` @ [9:17]",
]
