[[case]]
name = "equal"
kind = "parser"
entrypoint = "expr"
source = """
1 == 1
"""
expected_ast = """
Expr(
  span: (0, 6),
  data: Binary(BinaryOp(
    kind: Equal,
    left: Expr(
      span: (0, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
    right: Expr(
      span: (5, 1),
      data: Integer(IntegerLiteral(
        value: 1,
      )),
    ),
  )),
)
"""

