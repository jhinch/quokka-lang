    if 1 then {
    }
    1 + 2;
}
"""
expected_ast = """
Item(
  data: FnDecl(FnDecl(
    signature: FnSig(
      name: ("main", 3, 4),
    ),
    body: Block(
      statements: [
        Expr(ExprSmt(
          value: If(If(
            condition: Integer((IntegerLiteral(
              value: 1,
            ), 19, 1)),
            true_block: Block(Block(
              statements: [],
            )),
            false_block: None,
          )),
        )),
        Expr(ExprSmt(
          value: Binary(BinaryOp(
            kind: Add,
            left: Integer((IntegerLiteral(
              value: 1,
            ), 38, 1)),
            right: Integer((IntegerLiteral(
              value: 2,
            ), 42, 1)),
          )),
        )),
      ],
    ),
  )),
)
"""

