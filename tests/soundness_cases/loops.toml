[[case]]
name = "loop_with_accumulator_is_optimized_soundly"
inputs = { N = [{ min = 0, max = 255 }] }
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    let sum = 0;
    loop {
        if i == n then {
            break;
        }
        sum = sum + i;
        i = i + 1;
    }
    return sum;
}

fn main() {
    N = 1;
    f();
}
"""

[[case]]
name = "loop_with_early_return_is_optimized_soundly"
inputs = { N = [{ min = 0, max = 255 }] }
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    loop {
        if i == n then {
            return i;
        }
        if i == 5 then {
            return 100;
        }
        i = i + 1;
    }
}

fn main() {
    N = 1;
    f();
}
"""
