[[case]]
name = "if_true_branch_diverges_is_ok"
kind = "analyzer"
source = """
fn foo() -> u8 {
    let c: u1 = 1;
    if c then {
        return 1;
    } else {
        return 2;
    }
}

fn main() {}
"""
expected_mir = """
foo -> u8:
  .bb1:
    c#2: u1 = copy 1
    jumpif c#2 != 0, .bb2, .bb3
  .bb2:
    #3: u8 = copy 1
    #RET: u8 = copy #3
    return
  .bb3:
    #4: u8 = copy 2
    #RET: u8 = copy #4
    return

@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto, region: Auto, address: None }
main -> unit:
  .bb1:
    return
"""
