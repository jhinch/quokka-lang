# Covers single-bit mask tests (`(x & m) == 0` and `(x & m) != 0` with a single-bit literal `m`),
# which are selected as a `BIT` of the operand rather than an `AND` followed by a compare. Each
# case tests both a set and a clear bit, with other bits of the operand set so that testing the
# wrong bit is caught.

[[case]]
name = "ne_zero_branches_on_the_tested_bit"
source = """
global IN: u8;

#[address = 0xC000]
global OUT_SET: u8;
#[address = 0xC001]
global OUT_CLEAR: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b0100_1000;
    OUT_SET = 0;
    OUT_CLEAR = 0;
    let x = IN;
    if (x & 0x08) != 0 then {
        OUT_SET = 1;
    }
    if (x & 0x10) != 0 then {
        OUT_CLEAR = 1;
    }

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
[[case.assertion]]
addr = 0xC001
expected = 0

