[[case]]
name = "empty_struct"
kind = "parser"
entrypoint = "expr"
source = """
Foo {}
"""
expected_ast = """
Expr(
  span: (0, 6),
  data: Struct(StructExpr(
    name: ("Foo", (0, 3)),
    fields: [],
  )),
)
"""

[[case]]
name = "single_field"
kind = "parser"
entrypoint = "expr"
source = """
Foo { a: 1 }
"""
expected_ast = """
Expr(
  span: (0, 12),
  data: Struct(StructExpr(
    name: ("Foo", (0, 3)),
    fields: [
      StructExprField(
        name: ("a", (6, 1)),
        value: Expr(
          span: (9, 1),
          data: Integer(IntegerLiteral(
            value: 1,
          )),
        ),
      ),
    ],
  )),
)
"""

