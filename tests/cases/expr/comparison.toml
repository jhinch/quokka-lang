  span: (0, 20),
  data: Binary(BinaryOp(
    kind: Equal,
    left: Expr(
      span: (0, 8),
      data: Paren(Expr(
        span: (1, 6),
        data: Binary(BinaryOp(
          kind: Equal,
          left: Expr(
            span: (1, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (6, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
        )),
      )),
    ),
    right: Expr(
      span: (12, 8),
      data: Paren(Expr(
        span: (13, 6),
        data: Binary(BinaryOp(
          kind: Equal,
          left: Expr(
            span: (13, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
          right: Expr(
            span: (18, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
