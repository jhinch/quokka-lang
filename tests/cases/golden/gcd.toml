[[case]]
name = "analyze"
kind = "analyzer"
preview_features = ["function-call", "loop", "if-else"]
source.file = "gcd.q"
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global A: u16
@GlobalDeclAttributes { section: Auto }
global B: u16
@GlobalDeclAttributes { section: Auto }
global RESULT: u16

gcd -> u16:
  .bb1:
    a#2: u16 = load A
    b#3: u16 = load B
    jump .bb2
  .bb2:
    b#4: u16 = phi b#3 <- .bb1, b#11 <- .bb10
    #5: u16 = copy 0
    #6: u1 = eq b#4, #5
    a#7: u16 = phi a#2 <- .bb1, a#12 <- .bb10
    jumpif #6 != 0, .bb4, .bb5
  .bb4:
    #RET: u16 = copy a#7
    return
  .bb5:
    #8: u1 = lt b#4, a#7
    jumpif #8 != 0, .bb8, .bb9
  .bb8:
    a#9: u16 = sub a#7, b#4
    jump .bb10
  .bb9:
    b#10: u16 = sub b#4, a#7
    jump .bb10
  .bb10:
    b#11: u16 = phi b#4 <- .bb8, b#10 <- .bb9
    a#12: u16 = phi a#9 <- .bb8, a#7 <- .bb9
    jump .bb2

main -> unit:
  .bb1:
    #1: u16 = copy 1071
    store A = #1
    #2: u16 = copy 462
    store B = #2
    call gcd, .bb2
  .bb2:
    #3: u16 = returnvalue
    store RESULT = #3
    return
"""

