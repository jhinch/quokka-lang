[[case]]
name = "field_value_is_expression"
kind = "parser"
entrypoint = "expr"
source = """
Foo { a: 1 + 2 }
"""
expected_ast = """
Expr(
  span: (0, 16),
  data: Struct(StructExpr(
    name: ("Foo", (0, 3)),
    fields: [
      StructExprField(
        name: ("a", (6, 1)),
        value: Expr(
          span: (9, 5),
          data: Arithmetic(ArithmeticOp(
            kind: Add,
            left: Expr(
              span: (9, 1),
              data: Integer(IntegerLiteral(
                value: 1,
              )),
            ),
            right: Expr(
              span: (13, 1),
              data: Integer(IntegerLiteral(
                value: 2,
              )),
            ),
          )),
        ),
      ),
    ],
  )),
)
"""

[[case]]
