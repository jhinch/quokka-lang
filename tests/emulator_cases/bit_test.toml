    BIT_3 = (x & 0x08) == 0;
    BIT_4 = (x & 0x10) == 0;
    BIT_7 = (x & 0x80) == 0;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC001
expected = 0
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC002
expected = 1
mask = 0b0000_0001
[[case.assertion]]
addr = 0xC003
expected = 0
mask = 0b0000_0001

# The masked value is also stored, so it must still be computed, and the operand must survive
# both.
[[case]]
name = "masked_value_with_another_use_is_still_computed"
source = """
global IN: u8;

#[address = 0xC000]
global OUT: u8;
#[address = 0xC001]
global MASKED: u8;
#[address = 0xC002]
global IN_OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    IN = 0b0100_1000;
    OUT = 0;
    let x = IN;
    let masked = x & 0x08;
    MASKED = masked;
    if masked != 0 then {
        OUT = 1;
    }
    IN_OUT = x;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
[[case.assertion]]
addr = 0xC001
expected = 0x08
[[case.assertion]]
addr = 0xC002
expected = 0b0100_1000

# The cases below compare with the mask itself, which canonicalize rewrites to a compare with zero.

[[case]]
name = "eq_mask_branches_on_the_tested_bit"
preview_features = ["canonicalize"]
source = """
