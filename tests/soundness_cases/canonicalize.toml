# Every case here targets canonicalize, which the opt-out variants leave off: repeating each sweep
# with a different pass disabled would check nothing about the rewrites under test.
variants = ["canonicalize", "all"]

[[case]]
name = "add_add_chain_reassociates_soundly"
inputs = { N = [{ min = 0, max = 255 }] }
expect_rewrite = ["canonicalize"]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let a = n + 5;
    let b = a + n;
    return b;
}

fn main() {
    N = 1;
    f();
}
"""

[[case]]
name = "mixed_add_sub_chain_reassociates_soundly"
inputs = { N = [{ min = 0, max = 255 }] }
expect_rewrite = ["canonicalize"]
source = """
