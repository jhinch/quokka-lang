[[case]]
name = "prune_alone_does_not_touch_ordinary_compiled_mir"
kind = "analyzer"
optimize = true
preview_features = ["no-adce", "no-sccp"]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    if n == 0 then {
        n = 1;
    } else {
        n = 2;
    }
    return n;
}

fn main() {
    f();
}
"""
expected_mir = """
global N: u8

f -> u8:
  .bb1:
    n#2: u8 = load N
    #3: u8 = copy 0
    #4: u1 = eq n#2, #3
    jumpif #4 != 0, .bb2, .bb3
  .bb2:
    n#5: u8 = copy 1
    jump .bb4
  .bb3:
    n#6: u8 = copy 2
    jump .bb4
  .bb4:
    n#7: u8 = phi n#5 <- .bb2, n#6 <- .bb3
    #RET: u8 = copy n#7
    return

@{"entrypoint":true}
main -> unit:
  .bb1:
    call f, .bb2
  .bb2:
    return
"""

