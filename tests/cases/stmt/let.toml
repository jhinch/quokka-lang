[[case]]
name = "grouped_value"
kind = "parser"
entrypoint = "statement"
source = """
let x = (1 + 2);
"""
expected_ast = """
Statement(
  span: (0, 16),
  data: Let(LetSmt(
    name: ("x", (4, 1)),
    value: Expr(
      span: (8, 7),
      data: Paren(Expr(
        span: (9, 5),
        data: Binary(BinaryOp(
          kind: Add,
          left: Expr(
            span: (9, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (13, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      )),
    ),
  )),
)
"""

[[case]]
