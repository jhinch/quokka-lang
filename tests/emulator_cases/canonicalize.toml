[[case]]
name = "definitions_in_a_loop_read_in_its_exit"
source = """
global K: u8;
global M: u8;
global C: u8;

#[address = 0xC000]
global EQUAL: u8;
#[address = 0xC001]
global NEGATED: u8;
#[address = 0xC002]
global DIFFERENCE: u8;
#[address = 0xC003]
global ZERO: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    EQUAL = 0;
    K = 0x35;
    M = 0x0A;
    C = 0;
    let m = M;
    let v = 0;
    let w = 0;
    let d = 0;
    loop {
        let k = K;
        if C == 0 then {
            v = k + 5;
            w = !k;
            let l = k + 7;
            d = l - m;
            break;
        }
    }
    if v == 0x3A then {
        EQUAL = 1;
    }
    NEGATED = w + 1;
    DIFFERENCE = d;
    ZERO = d == 0;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 1
[[case.assertion]]
addr = 0xC001
expected = 0xCB
[[case.assertion]]
addr = 0xC002
expected = 0x32
[[case.assertion]]
addr = 0xC003
expected = 0
mask = 0b0000_0001

[[case]]
name = "long_chains_of_constants_and_operands"
source = """
global N: u8;
global A: u8;
global B: u8;
global C: u8;
global W: u16;

#[address = 0xC000]
global ADDS: u8;
#[address = 0xC001]
global MIXED: u8;
#[address = 0xC002]
global XORS: u8;
#[address = 0xC003]
global LEFT: u8;
#[address = 0xC004]
global WIDE: u1;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    N = 0x35;
    A = 0x10;
    B = 0x20;
    C = 0x03;
    W = 0x12F0;
    let n = N;
    let a = A;
    let b = B;
    let c = C;
    let w = W;
    ADDS = ((((((n + 1) + a) + 2) + b) + 3) + c) + 4;
    MIXED = (((((n - 1) + a) - 2) - b) + 3) - c;
    XORS = (((((n ^ 1) ^ a) ^ 2) ^ b) ^ 4) ^ c;
    LEFT = 1 + (a + (2 + (b + (3 + (c + n)))));
    WIDE = (((w + 0x20) - 0x1000) + 0xF0) == 0x0400;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x72
[[case.assertion]]
addr = 0xC001
expected = 0x22
[[case.assertion]]
addr = 0xC002
expected = 0x01
[[case.assertion]]
addr = 0xC003
expected = 0x6E
[[case.assertion]]
addr = 0xC004
expected = 1
mask = 0b0000_0001

[[case]]
name = "i8_comparisons_between_other_rewrites_in_one_block"
max_instructions = 2000
source = """
global N: i8;
global M: i8;

#[address = 0xC000]
global OUT: u8;

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    N = -3;
    M = 10;
    let n = N;
    let m = M;
    let a = n < 5;
    let s = m - 3;
    let b = s >= -2;
    let c = 3 < n;
    let x = n ^ -1;
    let d = x < 0;
    let e = (m & 8) >= 1;
    let p = (n + 2) == 7;
    let r = 0;
    if a then {
        r = r | 1;
    }
    if b then {
        r = r | 2;
    }
    if c then {
        r = r | 4;
    }
    if d then {
        r = r | 8;
    }
    if e then {
        r = r | 16;
    }
    if p then {
        r = r | 32;
    }
    OUT = r;

    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x13

