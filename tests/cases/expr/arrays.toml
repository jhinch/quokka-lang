[[case]]
name = "item_is_expression"
kind = "parser"
entrypoint = "expr"
source = """
[1 + 2, 3 - 4]
"""
expected_ast = """
Expr(
  span: (0, 14),
  data: Array(ArrayExpr(
    items: [
      Expr(
        span: (1, 5),
        data: Arithmetic(ArithmeticOp(
          kind: Add,
          left: Expr(
            span: (1, 1),
            data: Integer(IntegerLiteral(
              value: 1,
            )),
          ),
          right: Expr(
            span: (5, 1),
            data: Integer(IntegerLiteral(
              value: 2,
            )),
          ),
        )),
      ),
      Expr(
        span: (8, 5),
        data: Arithmetic(ArithmeticOp(
          kind: Sub,
          left: Expr(
            span: (8, 1),
            data: Integer(IntegerLiteral(
              value: 3,
            )),
          ),
          right: Expr(
            span: (12, 1),
            data: Integer(IntegerLiteral(
              value: 4,
            )),
          ),
        )),
      ),
    ],
  )),
)
"""

[[case]]
name = "item_is_struct_expr"
kind = "parser"
entrypoint = "expr"
source = """
[Foo { a: 1 }, Foo { a: 2 }]
"""
expected_ast = """
Expr(
  span: (0, 28),
  data: Array(ArrayExpr(
    items: [
      Expr(
        span: (1, 12),
        data: Struct(StructExpr(
          name: ("Foo", (1, 3)),
          fields: [
            StructExprField(
              name: ("a", (7, 1)),
              value: Expr(
                span: (10, 1),
                data: Integer(IntegerLiteral(
                  value: 1,
                )),
              ),
            ),
          ],
        )),
      ),
      Expr(
        span: (15, 12),
        data: Struct(StructExpr(
          name: ("Foo", (15, 3)),
          fields: [
            StructExprField(
              name: ("a", (21, 1)),
              value: Expr(
                span: (24, 1),
                data: Integer(IntegerLiteral(
                  value: 2,
                )),
              ),
            ),
          ],
        )),
      ),
    ],
  )),
)
"""

