[[case]]
name = "call_in_loop_accumulates_correctly"
source = """
#[address = 0xC000]
global OUT: u8;

fn get_one() -> u8 {
    return 1;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    let total: u8 = 0;
    let i: u8 = 0;
    loop {
        if i == 5 then {
            break;
        }
        total = total + get_one();
        i = i + 1;
    }
    OUT = total;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 5

[[case]]
name = "nested_calls_preserve_outer_local"
source = """
global A: u8;

#[address = 0xC000]
global OUT_A: u8;
#[address = 0xC001]
global OUT_RESULT: u8;

fn innermost() -> u8 {
    let p = 0x55;
    return p;
}

fn middle() -> u8 {
    let m = 0x03;
    let inner = innermost();
    return m + inner;
}

#[address = 0x0150]
fn checkpoint() {}

fn main() {
    A = 0x77;
    let a = A;
    let result = middle();
    OUT_A = a;
    OUT_RESULT = result;
    checkpoint();
}
"""
await_pc = 0x0150
[[case.assertion]]
addr = 0xC000
expected = 0x77
[[case.assertion]]
addr = 0xC001
expected = 0x58

