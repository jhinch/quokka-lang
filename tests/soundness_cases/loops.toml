# `consteval::evaluate` can only run this loop for N=0 - see the note on
# `loop_with_accumulator_is_optimized_soundly` below for why. This at least confirms the optimizer
# + harness are fine for the one iteration count that's currently evaluable.
[[case]]
name = "loop_that_never_iterates_is_optimized_soundly"
values = [0]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    let sum = 0;
    loop {
        if i == n then {
            break;
        }
        sum = sum + i;
        i = i + 1;
    }
    return sum;
}

fn main() {
    N = 1;
    f();
}
"""

# keep inputs small: this loop is O(n) in the interpreter and n=255 would run 255 times, which is
# unnecessary to prove the point
[[case]]
name = "loop_with_accumulator_is_optimized_soundly"
values = [0, 1, 2, 3, 4, 10, 20]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    let sum = 0;
    loop {
        if i == n then {
            break;
        }
        sum = sum + i;
        i = i + 1;
    }
    return sum;
}

fn main() {
    N = 1;
    f();
}
"""

[[case]]
name = "loop_with_early_return_is_optimized_soundly"
values = [0, 1, 3, 5, 6, 9]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let i = 0;
    loop {
        if i == n then {
            return i;
        }
        if i == 5 then {
            return 100;
        }
        i = i + 1;
    }
}

fn main() {
    N = 1;
    f();
}
"""
