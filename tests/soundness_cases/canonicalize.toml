[[case]]
name = "add_add_chain_reassociates_soundly"
values = [0, 1, 2, 3, 5, 10, 127, 128, 200, 255]
source = """
global N: u8;

fn f() -> u8 {
    let n = N;
    let a = n + 5;
    let b = a + n;
    return b;
}

fn main() {
    N = 1;
    f();
}
"""

