[[case]]
name = "add_matching_types_ok"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u8 = 2;
    let z: u8 = x + y;
}
"""
expected_mir = """
@FnDeclAttributes { entrypoint: true, no_startup_code: false, inline: Auto }
main -> unit:
  .bb1:
    x#1: u8 = copy 1
    y#2: u8 = copy 2
    z#3: u8 = add x#1, y#2
    return
"""

[[case]]
name = "add_mismatched_types_error"
kind = "analyzer"
source = """
fn main() {
    let x: u8 = 1;
    let y: u1 = 1;
    let z = x + y;
}
"""
expected_errors = [
    "`u8` is not equal to `u1` @ [66:67]",
]

