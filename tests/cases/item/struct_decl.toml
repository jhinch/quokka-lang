"""

[[case]]
name = "missing_comma_between_fields"
kind = "parser"
entrypoint = "item"
source = """
struct Point {
    x: u8
    y: u8
}
"""
expected_errors = [
    "Syntax error: found Ident when expecting [Comma] @ [29:30]",
]

[[case]]
name = "single_field"
kind = "parser"
source = """
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      data: StructDecl(StructDecl(
        name: ("Name", (7, 4)),
        fields: [
          FieldDecl(
            name: ("field", (18, 5)),
            ty: TyRef(
              span: (25, 2),
              name: ("u8", (25, 2)),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""

[[case]]
name = "struct_with_attribute"
kind = "parser"
source = """
#[this_attribute]
struct Name {
    field: u8,
}
"""
expected_ast = """
Root(
  items: [
    Item(
      attributes: [
        AttributeDecl(
          name: ("this_attribute", (2, 14)),
        ),
      ],
      data: StructDecl(StructDecl(
        name: ("Name", (25, 4)),
        fields: [
          FieldDecl(
            name: ("field", (36, 5)),
            ty: TyRef(
              span: (43, 2),
              name: ("u8", (43, 2)),
            ),
          ),
        ],
      )),
    ),
  ],
)
"""


