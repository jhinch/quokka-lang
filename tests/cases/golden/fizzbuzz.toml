[[case]]
name = "analyze"
kind = "analyzer"
preview_features = ["function-call", "loop", "if-else", "array"]
source.file = "fizzbuzz.q"
expected_mir = """
@GlobalDeclAttributes { section: Auto }
global MOD_x: u8
@GlobalDeclAttributes { section: Auto }
global MOD_y: u8
@GlobalDeclAttributes { section: Auto }
global N: u8
@GlobalDeclAttributes { section: Auto }
global RESULTS: [u8; 15]

x_mod_y -> u8:
  .bb1:
    result#2: u8 = load MOD_x
    jump .bb2
  .bb2:
    result#3: u8 = phi result#2 <- .bb1, result#7 <- .bb5
    #4: u8 = load MOD_y
    #5: u1 = lt result#3, #4
    jumpif #5 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    #6: u8 = load MOD_y
    result#7: u8 = sub result#3, #6
    jump .bb2
  .bb3:
    #RET: u8 = copy result#3
    return

fizzbuzz -> u8:
  .bb1:
    #2: u8 = load N
    store MOD_x = #2
    #3: u8 = copy 3
    store MOD_y = #3
    call x_mod_y, .bb2
  .bb2:
    mod3#4: u8 = returnvalue
    #5: u8 = copy 5
    store MOD_y = #5
    call x_mod_y, .bb3
  .bb3:
    mod5#6: u8 = returnvalue
    #7: u8 = copy 0
    #8: u1 = eq mod3#4, #7
    jumpif #8 != 0, .bb4, .bb5
  .bb4:
    #9: u8 = copy 0
    #10: u1 = eq mod5#6, #9
    jumpif #10 != 0, .bb6, .bb7
  .bb5:
    #13: u8 = copy 0
    #14: u1 = eq mod5#6, #13
    jumpif #14 != 0, .bb12, .bb13
  .bb6:
    #11: u8 = copy 3
    #RET: u8 = copy #11
    return
  .bb7:
    #12: u8 = copy 1
    #RET: u8 = copy #12
    return
  .bb12:
    #15: u8 = copy 2
    #RET: u8 = copy #15
    return
  .bb13:
    #16: u8 = copy 0
    #RET: u8 = copy #16
    return

main -> unit:
  .bb1:
    i#1: u16 = copy 0
    n#2: u8 = copy 1
    jump .bb2
  .bb2:
    i#3: u16 = phi i#1 <- .bb1, i#9 <- .bb8
    #4: u16 = copy 15
    #5: u1 = eq i#3, #4
    n#6: u8 = phi n#2 <- .bb1, n#11 <- .bb8
    jumpif #5 != 0, .bb4, .bb5
  .bb4:
    jump .bb3
  .bb5:
    store N = n#6
    call fizzbuzz, .bb8
  .bb3:
    return
  .bb8:
    #7: u8 = returnvalue
    store RESULTS[i#3] = #7
    #8: u16 = copy 1
    i#9: u16 = add i#3, #8
    #10: u8 = copy 1
    n#11: u8 = add n#6, #10
    jump .bb2
"""

