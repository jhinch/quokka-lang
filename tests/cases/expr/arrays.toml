[[case]]
name = "analyzer_array_expr_with_all_type_annotations"
kind = "analyzer"
source = """
fn main() {
    let a: u8 = 1;
    let b: [u8; 1] = [a];
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u8 = copy 1
    #2: [u8; 1] = alloc
    b#3: [u8; 1] = write #2[0] = a#1
    return
"""

[[case]]
name = "analyzer_array_expr_inferred_item"
kind = "analyzer"
source = """
fn main() {
    let a: [u8; 1] = [1];
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    #1: [u8; 1] = alloc
    #2: u8 = copy 1
    a#3: [u8; 1] = write #1[0] = #2
    return
"""

[[case]]
name = "analyzer_array_expr_inferred_ty"
kind = "analyzer"
source = """
fn main() {
    let a: u8 = 1;
    let b = [a];
}
"""
expected_mir = """
@{"entrypoint":true}
main -> unit:
  .bb1:
    a#1: u8 = copy 1
    #2: [u8; 1] = alloc
    b#3: [u8; 1] = write #2[0] = a#1
    return
"""

